openapi: 3.1.0
info:
  title: Bootsprüfung Lernplattform – App-API (boatingschool/v1)
  version: 1.12.0
  summary: REST-API der mobilen Lern-Apps (Flutter, iOS/Android, online-only).
  description: >-
    Umgesetzt im WordPress-Plugin `bootspruefung-learning` (Verzeichnis `src/Mobile/`).
    Die App nutzt dieselben Konten (WordPress/WooCommerce), Inhalte, Shop-Zugänge,
    Lernstände und Prüfungsregeln wie der Web-Lernbereich unter /bootsscheine/.
    Grundlage ist der Konzept-Vertrag `openapi-concept-original.yaml`; jede Abweichung ist in
    `README.md` (Abschnitt „Änderungen gegenüber dem Konzept“) begründet und hier mit
    „Abweichung:“ bzw. „Erweiterung:“ markiert.


    Konventionen: JSON (UTF-8), Zeitstempel RFC 3339 in UTC, alle IDs als Strings
    (numerische Werte), Erfolgsantworten in der Hülle `{data, meta?}`, Fehler als
    `application/problem+json` (Schema `Problem`). Alle Antworten tragen
    `Cache-Control: private, no-store, max-age=0` und `X-Request-Id`.
  contact:
    name: Bootsprüfung Lernplattform
servers:
  - url: https://{host}/wp-json/boatingschool/v1
    description: WordPress-Website des Shops (Pretty Permalinks).
    variables:
      host:
        default: learnboating.example.at
  - url: http://localhost:8080/wp-json/boatingschool/v1
    description: Docker-Staging (nur lokal).
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Account
  - name: Courses
  - name: Learning
  - name: Exams
  - name: Videos
  - name: Navigation
  - name: Praxis
  - name: Radio
  - name: ExamRegistration
  - name: Coupons
  - name: Groups
  - name: Tips
  - name: CustomerFaq
  - name: Privacy
  - name: Files
  - name: System
paths:
  /health:
    get:
      tags: [System]
      operationId: health
      summary: Erreichbarkeit und Server-Voraussetzungen
      description: >-
        Erweiterung: öffentlich, ohne Tenant. `authorization_header_received` zeigt, ob ein
        mitgesendeter Authorization-Header bei PHP ankommt (Server-Konfiguration prüfen).
        Antwortet auch bei abgeschalteter App (`status: disabled`).
      security: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, api_version, tenant_slug, tenant_name, authorization_header_received, https, server_time]
                    properties:
                      status: {type: string, enum: [ok, disabled]}
                      api_version: {type: string}
                      plugin_version: {type: string}
                      tenant_slug: {type: string}
                      tenant_name: {type: string}
                      authorization_header_received: {type: boolean}
                      https: {type: boolean}
                      server_time: {type: string, format: date-time}
                      legal:
                        description: >-
                          Seit 1.8.0: Rechtstexte zum Öffnen im Systembrowser, ohne Anmeldung (z. B. auf dem
                          Anmeldebildschirm). Nur veröffentlichte Seiten, sonst null.
                        type: object
                        properties:
                          privacy_policy: {type: [string, 'null'], format: uri}
                          imprint: {type: [string, 'null'], format: uri}
                          terms: {type: [string, 'null'], format: uri}
                          withdrawal_policy: {type: [string, 'null'], format: uri}
                          withdrawal_function: {type: [string, 'null'], format: uri, description: 'Widerrufsbutton nach § 356a BGB'}
                          contact: {type: [string, 'null'], format: uri}
                      min_app_version:
                        description: >-
                          Seit 1.8.0: Mindestversion je Plattform (Admin-Einstellung); null = keine Vorgabe. Liegt die
                          App darunter, antworten alle anderen Endpunkte mit 426 APP_UPDATE_REQUIRED.
                        type: object
                        properties:
                          ios: {type: [string, 'null']}
                          android: {type: [string, 'null']}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Mit dem bestehenden Shop-/Lernkonto anmelden
      description: >-
        E-Mail-Adresse oder Benutzername plus Passwort (WordPress `wp_authenticate`, setzt keine
        Cookies). Kein Tenant-Header nötig. Limits in 15 Minuten (seit 1.4.0, atomare Zähler):
        5 Fehlversuche je E-Mail-Adresse **und** Client-IP, 10 je Client-IP, 30 je E-Mail-Adresse
        insgesamt (danach 429 mit `retry_after`). Eine erfolgreiche Anmeldung setzt den Zähler
        E-Mail + IP zurück. Bis 1.3.x sperrten schon 5 Fehlversuche von beliebigen IPs das Konto.
        Client-IP: `REMOTE_ADDR`; `X-Forwarded-For` nur von im Shop eingetragenen Proxys.
        Abweichung: Konten gelten immer als bestätigt (`email_verified: true`), es gibt keine
        eingeschränkte Sitzung und keinen Bestätigungsablauf – die App darf keine
        E-Mail-Bestätigung anbieten.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Anmeldung erfolgreich
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Token-Paar rotieren
      description: >-
        Liefert ein neues Access- und Refresh-Token; das bisherige Refresh-Token ist danach
        verbraucht. Seit 1.4.0 (verlorene Antwort, z. B. Funkloch): Wird **innerhalb von 60
        Sekunden** nach einer Rotation das unmittelbar vorherige Refresh-Token erneut vorgelegt,
        rotiert der Server noch einmal und liefert **200 mit einem neuen, gültigen Token-Paar**
        derselben Sitzung (`session_id` gleich). Das zuvor ausgegebene (verlorene) Paar wird dabei
        ungültig – gültig ist immer nur das **zuletzt erhaltene** Paar. Das Fenster zählt ab der
        ersten Rotation und verlängert sich durch Wiederholungen nicht. Nach 60 Sekunden widerruft
        die Wiederverwendung die Sitzung (401 `REFRESH_TOKEN_REUSED`). Ein ersetztes, nie
        vorgelegtes Refresh-Token ergibt 401 `UNAUTHENTICATED` (Sitzung bleibt). 409
        `REFRESH_TOKEN_ROTATED` kommt nur noch bei extremen Wettläufen vor (dann einmal
        wiederholen). Bis 1.3.x: 409 ohne Tokens innerhalb von 10 Sekunden. Refresh-Aufrufe in der
        App weiterhin serialisieren und neue Tokens sofort speichern.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string, minLength: 20}
      responses:
        '200':
          description: Neues Token-Paar
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPairResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutCurrentSession
      summary: Aktuelle Gerätesitzung beenden
      responses:
        '204': {description: Sitzung beendet}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: E-Mail zum Zurücksetzen des Passworts anfordern
      description: >-
        WordPress-/WooCommerce-Mechanismus (`retrieve_password`). Antwort immer 202, unabhängig
        davon, ob es das Konto gibt. Limit: 10 je IP und 3 je Adresse pro Stunde. Der Link in der
        E-Mail führt auf die Web-Seite zum Setzen des Passworts. Seit 1.3.0: Sind im Shop
        App-Kennungen für Universal Links/App Links eingetragen, zeigt der Link dieser (aus der App
        angeforderten) Mail auf `https://<shop>/app/passwort/?key=…&login=…` – ist die App
        installiert, öffnet das System die App, die `key` als `token` an `/auth/password/reset`
        übergibt; sonst leitet die Website auf die normale Seite zum Passwortsetzen weiter. Die
        Server-Dateien `/.well-known/apple-app-site-association` und `/.well-known/assetlinks.json`
        liefert die Website nur mit diesen Einträgen aus. Über die Website angeforderte Mails
        bleiben unverändert.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202': {description: Anfrage angenommen}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Neues Passwort mit dem Schlüssel aus der Reset-E-Mail setzen
      description: >-
        `token` ist der Parameter `key` aus dem Link der Reset-E-Mail (WordPress
        `check_password_reset_key`). Konto über `email` oder – seit 1.3.0, z. B. aus dem App-Link
        `/app/passwort/?key=…&login=…` – über `login` (Benutzername); mit beiden müssen sie
        zusammenpassen. Ungültiger/abgelaufener Schlüssel: 422 `PASSWORD_RESET_INVALID_OR_EXPIRED`.
        Erfolg widerruft alle App-Sitzungen des Kontos.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirmation]
              anyOf:
                - required: [email]
                - required: [login]
              properties:
                email: {type: string, format: email}
                login: {type: string, maxLength: 60, description: 'Benutzername (Parameter login des Reset-Links); seit 1.3.0'}
                token: {type: string, minLength: 1}
                password: {type: string, minLength: 12, writeOnly: true}
                password_confirmation: {type: string, minLength: 12, writeOnly: true}
      responses:
        '204': {description: Passwort geändert; alle App-Sitzungen widerrufen}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/web-session:
    post:
      tags: [Auth]
      operationId: createWebSession
      summary: Einmal-URL für die eingebettete Webansicht (Sitzungsübergabe App → Web)
      description: >-
        Erweiterung (1.3.0), z. B. für den Funkgerät-Simulator in einer Webansicht der Tablet-App.
        Liefert eine URL `https://<shop><redirect>?bp_app_login=<Code>`; beim Aufruf setzt die
        Website das WordPress-Anmeldecookie (Sitzungscookie, ohne „angemeldet bleiben“) und leitet
        auf das Ziel ohne Code weiter (`Referrer-Policy: no-referrer`, `Cache-Control: no-store`).
        Code: 32 Zufallsbytes, nur als Hash gespeichert, **60 Sekunden** gültig, **einmal**
        verwendbar, an Konto und App-Sitzung gebunden – Abmeldung/Widerruf der Sitzung oder eine
        Passwortänderung machen offene Codes unbrauchbar. Ungültig, abgelaufen oder schon benutzt →
        Weiterleitung auf die Anmeldeseite mit `redirect_to` aufs Ziel (ohne Grund).
        `redirect` nur Pfade im Lernbereich dieser Website (`/bootsscheine/…`, auch als absolute
        URL derselben Website); alles andere → 422. Konten mit Verwaltungsrechten
        (`manage_options`, `edit_others_posts`) → 403 `WEB_SESSION_NOT_ALLOWED`; im Shop
        abgeschaltet → 403 `WEB_SESSION_DISABLED`. Limit: 20 je Konto in 15 Minuten.
        Die URL sofort in der Webansicht öffnen, nicht speichern, nicht protokollieren.


        **Seit 1.4.0 (Schutz vor Login-CSRF, Vertragsänderung):** Die Antwort enthält zusätzlich
        `verifier` und `verifier_header` (`X-Boatingschool-Web-Verifier`). Die App muss die URL in
        ihrer Webansicht **mit diesem Header** laden (Android `WebView.loadUrl(url, mapOf(header to
        verifier))`, iOS `URLRequest` mit `setValue(verifier, forHTTPHeaderField: header)` und
        `WKWebView.load(request)`). Ohne bzw. mit falschem Header (z. B. Link aus Mail/Chat im
        Browser geöffnet) wird niemand angemeldet: Code verbraucht, Anmeldeseite ohne Grund. Ist in
        der Webansicht bereits ein **anderes** WordPress-Konto angemeldet, wird nicht umgeschaltet
        (Code verbraucht, Anmeldeseite; die bestehende Anmeldung bleibt) – die App löscht beim
        Abmelden/Kontowechsel die Cookies der Webansicht. Der Header ist nur beim ersten Laden
        nötig (die anschließende Weiterleitung braucht ihn nicht).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebSessionRequest'}
      responses:
        '201':
          description: Einmal-URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebSessionResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /me:
    get:
      tags: [Account]
      operationId: getCurrentUser
      summary: Profil, Mitgliedschaft (Bootsschule) und Marke
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/sessions:
    get:
      tags: [Account]
      operationId: listSessions
      summary: Aktive App-Gerätesitzungen
      responses:
        '200':
          description: Eigene Sitzungen
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DeviceSession'}
        '401': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Account]
      operationId: revokeOtherSessions
      summary: Alle anderen Geräte abmelden
      description: Erweiterung.
      responses:
        '204': {description: Alle anderen Sitzungen widerrufen}
        '401': {$ref: '#/components/responses/Problem'}
  /me/sessions/{sessionId}:
    delete:
      tags: [Account]
      operationId: revokeSession
      summary: Einzelne Gerätesitzung widerrufen
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': {description: Sitzung widerrufen}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /me/settings:
    get:
      tags: [Account]
      operationId: getAppSettings
      summary: Synchronisierte App-Einstellungen lesen
      description: >-
        Erweiterung (1.3.0). Von der App frei definiertes JSON-Objekt je Konto (geräteübergreifend).
        Ohne gespeicherte Einstellungen: `settings: {}`, `version: 0`, `updated_at: null`.
        Header `ETag: "<version>"`. Nur für Einstellungen, die auf allen Geräten gelten sollen;
        rein lokale Einstellungen bleiben auf dem Gerät.
      responses:
        '200':
          description: Einstellungen
          headers:
            ETag:
              schema: {type: string}
              description: Version in Anführungszeichen, z. B. "3"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppSettingsResponse'}
        '401': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Account]
      operationId: replaceAppSettings
      summary: App-Einstellungen vollständig ersetzen
      description: >-
        Erweiterung (1.3.0). Ersetzt das ganze Objekt (kein Zusammenführen); `version` steigt um 1.
        Grenzen: Objekt, höchstens 8192 Bytes (kompaktes UTF-8-JSON), höchstens 4 Ebenen
        (das Objekt selbst ist Ebene 1), Schlüssel `^[a-z0-9_.-]{1,64}$`, Werte Text, Zahl,
        Wahrheitswert, null, Liste oder Objekt – sonst 422. Optimistisches Sperren:
        `If-Match: "<version>"` oder `expected_version`; passt die Version nicht → 409
        `VERSION_CONFLICT` mit aktuellem Stand in `details.current` (App führt zusammen und sendet
        erneut). Ohne Versionsangabe gewinnt der letzte Schreibvorgang.
      parameters:
        - in: header
          name: If-Match
          required: false
          description: Erwartete Version, z. B. "3" (alternativ `expected_version` im Body)
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppSettingsRequest'}
      responses:
        '200':
          description: Gespeichert
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppSettingsResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /me/deletion-request:
    post:
      tags: [Privacy]
      operationId: requestAccountDeletion
      summary: Kontolöschung beantragen
      description: >-
        Erweiterung (App-Store-Vorgabe von Apple): legt eine WordPress-Datenschutzanfrage
        „Personenbezogene Daten löschen“ an und schickt die Bestätigungs-E-Mail. Nach der
        Bestätigung löscht der Shop sofort Lernstand, App-Sitzungen und das Konto selbst;
        Bestellungen bleiben anonymisiert (ohne Namen und Kontaktdaten) für die
        Aufbewahrungsfristen erhalten (Einstellung „Datenschutz-Anträge automatisch ausführen“, Standard
        an; ist sie aus oder hat das Konto Verwaltungsrechte, bearbeitet der Shop den Antrag in den
        WordPress-Werkzeugen). Ein offener Antrag wird nicht doppelt angelegt (`already_requested: true`).
        Seit 1.4.0: Sind im Shop App-Kennungen (Universal Links/App Links) eingetragen, zeigt der
        Bestätigungslink dieser Mail auf `https://<shop>/app/konto-loeschen/?request_id=…&confirm_key=…`
        (öffnet die App → `POST /me/deletion-request/confirm`); ohne App leitet die Website auf die
        WordPress-Bestätigung (`wp-login.php?action=confirmaction&…`) weiter.
      responses:
        '202':
          description: Antrag angelegt bzw. bereits vorhanden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionRequestResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /me/deletion-request/confirm:
    post:
      tags: [Privacy]
      operationId: confirmAccountDeletion
      summary: Löschantrag mit dem Link aus der Bestätigungsmail bestätigen
      description: >-
        Erweiterung (1.4.0). Ohne Anmeldung und ohne Tenant (wie Passwort-Reset): die App liest
        `request_id` und `confirm_key` aus dem App-Link `/app/konto-loeschen/?request_id=…&confirm_key=…`.
        Der Server prüft wie WordPress (`wp_validate_user_request_key`, 24 h gültig) und bestätigt den
        Antrag genau wie `wp-login.php?action=confirmaction` (Aktion `user_request_action_confirmed`:
        Status „bestätigt“, Benachrichtigung an die Verwaltung). Nur Löschanträge. Ungültig,
        abgelaufen, schon bestätigt oder kein Löschantrag → einheitlich 422
        `DELETION_CONFIRMATION_INVALID`. Limit: 20 je IP und 10 je Antrag pro Stunde.
        Danach wird der Antrag sofort ausgeführt (siehe `POST /me/deletion-request`): Antwort
        `status: completed`, das Konto ist gelöscht, alle Tokens sind ungültig – die App meldet sich
        ab und verwirft lokale Daten. `status: confirmed` = der Shop bearbeitet den Antrag von Hand.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, confirm_key]
              properties:
                request_id: {type: [string, integer], description: Parameter request_id des Links}
                confirm_key: {type: string, minLength: 1, maxLength: 100, description: Parameter confirm_key des Links}
      responses:
        '200':
          description: Antrag bestätigt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionRequestResponse'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /me/groups:
    get:
      tags: [Groups]
      operationId: listMyGroups
      summary: Eigene Gruppenlizenzen (Verwaltung)
      description: >-
        Erweiterung (1.7.0), wie „Meine Gruppen“ im Web (`GroupService::forOwner`): alle Gruppen, die
        dem Konto gehören (Käufer:in der Gruppenlizenz), mit Plätzen, Umfang, Beitrittscode/-link und
        Mitgliedern samt offenen und abgelaufenen Einladungen. Ohne Tenant (wie alle `/me*`).
        Gruppen, in denen das Konto nur Mitglied ist, erscheinen nicht (auch im Web nicht) – deren
        Zugänge stehen in `/courses`. Leere Liste = keine eigene Gruppe.
      responses:
        '200':
          description: Eigene Gruppen (neueste zuerst)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupListResponse'}
        '401': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}:
    get:
      tags: [Groups]
      operationId: getMyGroup
      summary: Eine eigene Gruppenlizenz
      description: Erweiterung (1.7.0). Fremde oder unbekannte Gruppe → 404 (keine Auskunft, ob es sie gibt).
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Gruppe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}/invites:
    post:
      tags: [Groups]
      operationId: inviteToMyGroup
      summary: Personen per E-Mail einladen
      description: >-
        Erweiterung (1.7.0), wie „Einladen“ im Web (`GroupService::invite`, gleiche Einladungsmail mit
        persönlichem Link `…/gruppe/i<32 Hex>/`, 30 Tage gültig). `emails` (bis 200) und/oder `email`;
        Adressen werden getrimmt, klein geschrieben und zusammengefasst. Wie im Web werden Adressen
        **übersprungen** (`skipped`, kein Fehler), wenn sie ungültig sind, bereits eingeladen/Mitglied
        sind, keine Plätze mehr frei sind oder das Tageslimit der Gruppe erreicht ist
        (`invites_remaining_today`: 20 je Gruppe und 24 h, bei großen Gruppen 2 × Plätze). Ohne
        Adresse → 422. Gruppe nicht aktiv → 409 `GROUP_NOT_ACTIVE`. Limit je Konto: 20 Einladungsvorgänge
        pro Stunde (429). Idempotency-Key wird vor dem Limit geprüft (Wiederholung = gespeicherte
        Antwort, keine zweite Mail).
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupInviteRequest'}
      responses:
        '200':
          description: Ergebnis (auch wenn alle Adressen übersprungen wurden)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupInviteResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}/members/{memberId}:
    delete:
      tags: [Groups]
      operationId: removeGroupMember
      summary: Platz freigeben (Mitglied entfernen bzw. Einladung zurückziehen)
      description: >-
        Erweiterung (1.7.0), wie „Platz freigeben“ im Web (`GroupService::removeMember`): Die
        Platz-Zugänge des Mitglieds werden widerrufen (Grund `reason`, sonst
        `group_member_removed`), offene Einladungen verlieren Link und E-Mail-Adresse sofort. Auch der
        eigene Platz der besitzenden Person kann freigegeben werden (wie im Web). Unbekanntes, bereits
        entferntes oder gruppenfremdes Mitglied → 404. `reason` als JSON-Body oder Query-Parameter.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MemberId'
        - in: query
          name: reason
          required: false
          schema: {type: string, maxLength: 190}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: [string, 'null'], maxLength: 190, description: 'Grund (z. B. „Kurs abgebrochen“), wird am widerrufenen Zugang gespeichert'}
      responses:
        '200':
          description: Gruppe nach dem Freigeben
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /me/groups/{groupId}/join-code:
    post:
      tags: [Groups]
      operationId: regenerateGroupJoinCode
      summary: Neuen Beitrittscode/-link erzeugen
      description: >-
        Erweiterung (1.7.0), wie „Neuer Link“ im Web (`GroupService::regenerateToken`): neuer
        Gruppen-Beitrittscode `g<32 Hex>`; der alte Code/Link ist sofort ungültig (Einlösen und
        Vorschau → 422 `COUPON_INVALID`). Persönliche Einladungen bleiben gültig. Mit
        Idempotency-Key liefert eine Wiederholung denselben neuen Code (kein weiterer Wechsel).
        Gruppe nicht aktiv → 409 `GROUP_NOT_ACTIVE`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Gruppe mit neuem `join_code`/`join_url`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: Alle Kurse mit Zugangsstatus, Fortschritt, Fähigkeiten und Shop-Link
      description: >-
        Alle veröffentlichten Kurse des Shops – auch gesperrte, damit die App sie mit Shop-Link
        anzeigen kann. Zugang und Teilumfang entscheidet derselbe AccessService wie im Web.
        Seit 1.9.0: Kurse, die ein besessener Kurs schon abdeckt, bleiben in der Liste und sind mit
        `relation.hidden = true` markiert (nicht weggelassen, damit Deep-Links und Kursdetails
        funktionieren); die App blendet sie in „Weitere Kurse“ aus. Empfohlene Kurse
        (`relation.recommended`) zeigt die App oben mit „Empfohlen“ und „Passt zu deinem Kurs …“.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Kursliste
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseListResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Kursdetails inkl. Angebote, Trainer, Dateien
      description: Auch für gesperrte Kurse abrufbar (zeigt Sperren und Kaufangebote).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Kursdetails
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseDetailResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/overview:
    get:
      tags: [Courses]
      operationId: getCourseOverview
      summary: Fortschritt, Module und Weiterlernen
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Kursübersicht
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseOverviewResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/modules:
    get:
      tags: [Courses]
      operationId: listModules
      summary: Module mit Themen, Sperren und Fortschritt
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Module
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Module'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/progress:
    get:
      tags: [Learning]
      operationId: getCourseProgress
      summary: Fortschritt je Kurs, Modul und Thema
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Lernfortschritt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/exam-registration:
    get:
      tags: [ExamRegistration]
      operationId: getExamRegistration
      summary: Prüfungsanmeldung – Anleitung und Prüfungsausschüsse (nur lesen)
      description: >-
        Erweiterung (ExamGuideService::payload wie die Web-Seite „Prüfung anmelden“). Lernende
        melden sich selbst beim Prüfungsausschuss an – die App sendet keine Anmeldung
        (`registration_in_app: false`) und verlinkt `web_url` bzw. die Kontaktdaten der Stellen.
        Kein Kurszugang nötig (wie im Web). 404, wenn der Shop die Seite abgeschaltet hat oder für
        den Kurs keine Anleitung existiert.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Anleitung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ExamRegistration'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/faqs:
    get:
      tags: [CustomerFaq]
      operationId: listCourseFaqs
      summary: Fragen & Antworten zum Kurs (Kunden-FAQ)
      description: >-
        Erweiterung (1.10.0). Dieselben veröffentlichten Kunden-FAQs wie „Fragen & Antworten zu deinem
        Kurs“ im Kurs-Hub des Web-Lernbereichs (`GET bootspruefung/v1/courses/{code}/customer-faqs`,
        `CustomerFaqRepository::forCourse`). Nur für Kunden des Kurses: voller Zugang zum Fragenkatalog
        (Kauf, manuelle Freigabe, Gruppe oder „Zugang ohne Shop“). Kostenloser Teilumfang (Testkurs):
        403 `CONTENT_LOCKED` mit `details.reason = partial_access`; ohne Zugang 403 `ENTITLEMENT_REQUIRED`
        (bzw. `ENTITLEMENT_EXPIRED`/`ENTITLEMENT_SUSPENDED`) mit `details.webshop_url`.
        Gruppiert nach Schein: der Kurs selbst (falls es eine Kategorie mit seinem Code gibt), dann die
        Teilscheine eines Kombikurses (SBF-SEE-BIN → SBF-SEE, SBF-BIN-MOTOR; SRC-UBI → SRC, UBI) bzw. der
        Zielschein einer Ergänzung (z. B. ADD-BIN-TO-SEE → SBF-SEE). Je Schein FAQs direkt am Schein und
        `subcategories` als flache Liste in Anzeigereihenfolge (Tiefensuche) mit `parent_id` und `depth`
        (1 = direkt unter dem Schein) – Überschriften je nach `depth` einrücken. Leere Unterkategorien
        und Scheine ohne FAQs fehlen; Reihenfolge nicht ändern. Antworten: `answer_html` (wp_kses_post,
        Links absolut), `answer_text` (Absätze durch Leerzeile, Listenpunkte „• “) und `links`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Scheine mit Unterkategorien und FAQs (leer, wenn keine veröffentlicht sind)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseFaqsResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/trainer/next:
    get:
      tags: [Learning]
      operationId: getNextTrainerQuestion
      summary: Nächste Frage im Smarttrainer bzw. Lernmodus
      description: >-
        Auswahl wie im Web (LearningService): nie gesehen → zuletzt falsch → schwaches Thema →
        Wiederholung; gefestigt nach 3 richtigen Antworten in Folge (mit zeitlichem Abstand).
        Fragen einer laufenden Prüfung, gesperrte Module (zeitgesteuerte Freigabe) und Fragen
        außerhalb des kostenlosen Teilumfangs werden nicht ausgeliefert.
        204 = im gewählten Modus ist keine Frage übrig.
        Abweichung: keine „3 Versuche, dann erledigt“-Regel – maßgeblich ist die Serie.


        **Bestimmte Frage gezielt üben (seit 1.7.0):** `mode=question&question_id=<Frage-ID>`
        (z. B. aus Favoriten, Fehlerliste oder Prüfungsauswertung) liefert genau diese Frage mit
        frischem `answer_token` – dieselbe Auslieferung wie im Smarttrainer (`LearningService::next`
        mit der Fragenauswahl [question_id]); die Antwort über `POST /courses/{courseId}/attempts`
        zählt in denselben Lernstand. Gleiche Freigaberegeln: Frage gehört nicht zum Kurs bzw. ist
        nicht auslieferbar → 404; außerhalb des kostenlosen Teilumfangs (`details.reason:
        partial_access`, `details.webshop_url`), in einem Modul mit zeitgesteuerter Freigabe
        (`scheduled_release`, `details.unlock_at`) oder Teil einer laufenden Prüfung (`running_exam`)
        → 403 `CONTENT_LOCKED`; ohne Smarttrainer-Zugang wie gewohnt 403 `ENTITLEMENT_*`. Die Frage
        kommt auch direkt nach einer Antwort wieder (kein Abstand wie im Smarttrainer). `question_id`
        ohne `mode=question` → 422. `remaining` ist null.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - in: query
          name: mode
          schema: {type: string, enum: [smarttrainer, new, wrong, topic, module, favorites, collection, exam_mistakes, question], default: smarttrainer}
        - in: query
          name: module_id
          description: Pflicht bei mode=module, optional sonst (eingrenzen).
          schema: {type: string}
        - in: query
          name: topic
          description: Pflicht bei mode=topic (Themenname aus /modules).
          schema: {type: string}
        - in: query
          name: collection_id
          description: Pflicht bei mode=collection.
          schema: {type: string}
        - in: query
          name: exam_id
          description: Pflicht bei mode=exam_mistakes (falsch beantwortete Fragen einer abgegebenen Prüfung).
          schema: {type: string}
        - in: query
          name: question_id
          description: Pflicht bei mode=question (seit 1.7.0), nur dort erlaubt. Frage-ID wie `question.id`.
          schema: {type: string}
      responses:
        '200':
          description: Frage verfügbar
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerQuestionResponse'}
        '204': {description: Keine passende Frage übrig}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/trainer/reveal:
    post:
      tags: [Learning]
      operationId: revealModelAnswer
      summary: Musterantwort einer offenen Frage anzeigen
      description: Erweiterung. Für Fragen mit `answer_selection = open` vor der Selbsteinschätzung.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer_token]
              properties:
                answer_token: {type: string}
      responses:
        '200':
          description: Musterantwort
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      model_answer: {type: [string, 'null']}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/attempts:
    post:
      tags: [Learning]
      operationId: submitTrainerAnswer
      summary: Antwort einreichen und serverseitig bewerten
      description: >-
        Bewertung, Speicherung (bp_attempt) und Lernstand (bp_progress) über LearningService –
        derselbe Lernstand wie im Web. Ein Frage-Token zählt genau einmal (erneutes Einreichen
        liefert das erste Ergebnis mit `repeated: true`). Gilt auch für Videoquiz-Fragen
        (answer_token aus GET /videos/{lessonId}). Antwortlimit: 60 je Minute.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TrainerAnswerRequest'}
      responses:
        '200':
          description: Frage-Token war bereits ausgewertet (repeated = true)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerAnswerResponse'}
        '201':
          description: Versuch gespeichert und ausgewertet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerAnswerResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/attempts/{attemptId}:
    get:
      tags: [Learning]
      operationId: getAttempt
      summary: Eigene Rückmeldung zu einem Versuch
      description: Vollständige Rückmeldung 7 Tage lang, danach Kerndaten (richtig/falsch, Auswahl).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Eigener Versuch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrainerAnswerResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/favorites:
    get:
      tags: [Learning]
      operationId: listFavorites
      summary: Favoriten (optional nach Sammlung gefiltert), sortiert
      description: >-
        Jeder Favorit hat `saved_at` (Zeitpunkt des Speicherns, bp_favorite.created_at), mit
        `collection_id` zusätzlich `assigned_at` (Zeitpunkt des Einsortierens in diese Sammlung,
        bp_favorite_collection_item.created_at). Beide sind nie null; erneutes Speichern bzw.
        Einsortieren ändert sie nicht. Sortierung serverseitig nach `sort`/`order`, bei gleichem
        Zeitpunkt nach `question_id` (gleiche Richtung) – stabil. Defekte Altdaten (Nulldatum)
        liefern `1970-01-01T00:00:00Z`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - in: query
          name: collection_id
          schema: {type: string}
        - in: query
          name: sort
          description: '`assigned_at` nur zusammen mit `collection_id` (sonst 422).'
          schema: {type: string, enum: [saved_at, assigned_at], default: saved_at}
        - in: query
          name: order
          schema: {type: string, enum: [desc, asc], default: desc}
      responses:
        '200':
          description: Favoriten
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoritesResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/mistakes:
    get:
      tags: [Learning]
      operationId: listMistakes
      summary: Zuletzt falsch beantwortete Fragen („Favoriten & Fehler“ im Web)
      description: Erweiterung.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
