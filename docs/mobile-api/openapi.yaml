  /courses/{courseId}/favorites/{questionId}:
    put:
      tags: [Learning]
      operationId: addFavorite
      summary: Frage als Favorit speichern (optional in Sammlungen)
      description: >-
        `collection_id` fügt eine Sammlung hinzu (bestehende bleiben), `collection_ids` setzt die
        Sammlungen vollständig (Erweiterung: eine Frage kann in mehreren Sammlungen liegen).
        Favoriten gelten wie im Web kontoweit.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_id: {type: [string, 'null']}
                collection_ids:
                  type: [array, 'null']
                  items: {type: string}
                context: {type: string, enum: [smart_learning, exam]}
      responses:
        '200':
          description: Favorit gespeichert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Learning]
      operationId: removeFavorite
      summary: Favorit entfernen (auch aus allen Sammlungen)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '204': {description: Entfernt oder war nicht vorhanden}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/favorite-collections:
    get:
      tags: [Learning]
      operationId: listFavoriteCollections
      summary: Eigene Sammlungen dieses Kurses
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Sammlungen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteCollectionsResponse'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Learning]
      operationId: createFavoriteCollection
      summary: Sammlung erstellen (höchstens 30 je Kurs, Name eindeutig, max. 60 Zeichen)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteCollectionRequest'}
      responses:
        '201':
          description: Sammlung erstellt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteCollectionResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/favorite-collections/{collectionId}:
    parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/CollectionId'
    patch:
      tags: [Learning]
      operationId: renameFavoriteCollection
      summary: Sammlung umbenennen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FavoriteCollectionRequest'}
      responses:
        '200':
          description: Umbenannt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteCollectionResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Learning]
      operationId: deleteFavoriteCollection
      summary: Sammlung löschen (Favoriten bleiben)
      responses:
        '204': {description: Gelöscht}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/exams:
    get:
      tags: [Exams]
      operationId: listExams
      summary: Prüfungsoptionen (Zufallssimulation nach Regelwerk und feste Bögen)
      description: >-
        Sperren wie im Web: kostenloser Teilumfang (`lock_reason: trial`, nur die ersten Bögen,
        keine Zufallssimulation) und zeitgesteuerte Freigabe (`lock_reason: drip`, `unlock_at`).
        `meta.live = false` heißt: kein verifiziertes Regelwerk – die Simulation läuft als Übung.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Optionen
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamOptionsResponse'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Exams]
      operationId: startExam
      summary: Prüfung starten oder laufende Prüfung fortsetzen
      description: Ohne `paper_id` (oder `simulation`) Zufallsprüfung nach Regelwerk, sonst fester Bogen. Eine laufende Prüfung derselben Art wird fortgesetzt.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartExamRequest'}
      responses:
        '201':
          description: Laufende (neue oder fortgesetzte) Prüfung
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamSessionResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}:
    get:
      tags: [Exams]
      operationId: getExam
      summary: Eigene Prüfung (laufend mit gespeicherten Antworten oder mit Ergebnis)
      description: Abgelaufene Prüfungen werden beim Abruf serverseitig ausgewertet (`status = evaluated`, `result.expired = true`).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Prüfung
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamSessionResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/answers/{questionId}:
    put:
      tags: [Exams]
      operationId: saveExamAnswer
      summary: Antwort in laufender Prüfung speichern (ohne Bewertung)
      description: >-
        `questionId` ist die Position (1…n) der Frage in dieser Prüfung, so wie sie in
        `questions[].id` ausgeliefert wird. Zeitpunkt zählt serverseitig; nach Fristende 410.
        Mehrfachauswahl: leere Auswahl nimmt die Antwort zurück. Offene Fragen: zuerst
        `/reveal`, dann `known` senden. Seit 1.3.0 speichert `marked_for_review` (true/false) die
        Markierung „zur Überprüfung“ wie `PUT …/flag`; null/fehlend lässt sie unverändert.
        Endet der Kurszugang während der Prüfung (Erstattung, Sperre, Ablauf), werden weitere
        Antworten, Markierungen und Aufdecken mit 403 `CONTENT_LOCKED` abgelehnt; die Abgabe
        (`POST /exams/{examId}/submit`) bleibt möglich und wertet die gespeicherten Antworten
        (wie im Web). Seit 1.11.0 (Funkloch): Antworten, die das Gerät zwischengespeichert hat, mit
        `age_ms` (Alter beim Senden in ms) oder `answered_at` (Gerätezeit) senden. Der Server nimmt sie
        bis 120 Sekunden nach Fristende noch an, wenn sie vor Fristende gegeben wurden (sonst 410
        `EXAM_EXPIRED`); erst danach wird eine abgelaufene Prüfung automatisch ausgewertet. Erneutes
        Senden derselben Antwort ist idempotent; ein älterer Stand überschreibt keinen neueren
        (`applied = false`, die Antwort enthält den gespeicherten Stand). Die App sollte Antworten bis
        zur Bestätigung lokal halten, bei Netzfehlern wiederholen und erst nach Bestätigung aller
        Antworten `submit` aufrufen (wie die Web-App).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/ExamQuestionPosition'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExamAnswerRequest'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamAnswerSavedResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/answers/{questionId}/reveal:
    post:
      tags: [Exams]
      operationId: revealExamModelAnswer
      summary: Musterantwort einer offenen Prüfungsfrage freigeben
      description: Erweiterung (wie im Web Voraussetzung für die Selbsteinschätzung).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/ExamQuestionPosition'
      responses:
        '200':
          description: Musterantwort
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      question_id: {type: string}
                      model_answer: {type: string}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/answers/{questionId}/flag:
    put:
      tags: [Exams]
      operationId: flagExamQuestion
      summary: Frage zur Überprüfung markieren bzw. Markierung entfernen
      description: >-
        Erweiterung (1.3.0). Nur in einer laufenden Prüfung; `questionId` ist die Position (1…n) wie
        bei `PUT /exams/{examId}/answers/{questionId}`. Serverseitig gespeichert:
        `GET /exams/{examId}` liefert `flagged` je Frage und `flagged_count`, damit die App beim
        Fortsetzen die Markierungen wiederherstellt. Ändert weder Antwort noch Bewertung.
        Nach Abgabe 409 `EXAM_ALREADY_SUBMITTED`, nach Fristende 410 `EXAM_EXPIRED`.
        Der Web-Lernbereich zeigt und setzt dieselben Markierungen.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/ExamQuestionPosition'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExamFlagRequest'}
      responses:
        '200':
          description: Markierung gespeichert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamFlagResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/submit:
    post:
      tags: [Exams]
      operationId: submitExam
      summary: Prüfung abgeben und auswerten
      description: >-
        Erneuter Aufruf liefert dasselbe Ergebnis. Auch nach Ende des Kurszugangs möglich
        (gespeicherte Antworten werden gewertet); eine neue Prüfung lässt sich dann nicht starten.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamResultResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/abort:
    post:
      tags: [Exams]
      operationId: abortExam
      summary: Laufende Prüfung abbrechen (ohne Wertung)
      description: >-
        Seit 1.11.0. Beendet eine laufende Prüfung ohne Wertung (`status: aborted`). Sie erscheint nicht
        im Verlauf und nicht als letztes Ergebnis eines Bogens; ihre Fragen sind im Lernmodus sofort wieder
        frei. Bereits gegebene Antworten bleiben gespeichert. Ist die Prüfungszeit schon abgelaufen, wird sie
        stattdessen gewertet (`status: evaluated` mit `result`). Erneuter Aufruf liefert denselben Stand.
        Danach liefern Antworten, Markieren und `result` 409 `EXAM_ABORTED`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Abgebrochen bzw. (nach Fristende) gewertet
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [exam_id, status, aborted_at, result]
                    properties:
                      exam_id: {type: string}
                      status: {type: string, enum: [aborted, evaluated]}
                      aborted_at: {type: ['string', 'null'], format: date-time}
                      result:
                        oneOf:
                          - {$ref: '#/components/schemas/ExamResult'}
                          - type: 'null'
        '404': {$ref: '#/components/responses/Problem'}
  /exams/{examId}/result:
    get:
      tags: [Exams]
      operationId: getExamResult
      summary: Ergebnis einer abgegebenen Prüfung
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamResultResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/videos:
    get:
      tags: [Videos]
      operationId: listVideoModules
      summary: Videokapitel und Lektionen
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Kapitel
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoListResponse'}
        '403': {$ref: '#/components/responses/Problem'}
  /videos/{lessonId}:
    get:
      tags: [Videos]
      operationId: getVideoLesson
      summary: Lektion mit Medien, Schrittgalerie und Videoquiz
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lektion
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoLessonResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /videos/{lessonId}/progress:
