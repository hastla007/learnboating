                  meta:
                    type: object
                    properties:
                      total: {type: integer}
                      known: {type: integer}
        '403': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/praxis/{cardId}:
    put:
      tags: [Praxis]
      operationId: setPraxisStatus
      summary: Kartenstatus setzen („kann ich“ / „noch üben“ / offen)
      parameters:
