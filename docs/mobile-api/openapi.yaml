      responses:
        '200':
          description: Ergebnis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExamResultResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
