                    type: object
                    required: [letters, digits, catalogs]
                    properties:
                      letters:
                        type: array
                        items:
                          type: object
                          required: [letter, word]
                          properties:
                            letter: {type: string}
                            word: {type: string}
                            hint: {type: [string, 'null'], description: Aussprachehilfe}
                      digits:
                        type: array
                        items:
                          type: object
                          required: [catalog, items]
                          properties:
                            catalog: {type: string, enum: [SRC, UBI]}
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  digit: {type: string}
                                  word: {type: string}
                                  spoken: {type: [string, 'null']}
                      catalogs: {type: array, items: {type: string, enum: [SRC, UBI]}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}:
    get:
      tags: [Radio]
      operationId: getRadioText
      summary: Funktext (SRC-Übersetzung, UBI-Diktat/-Buchstabieren) mit gespeicherten Eingaben
      description: >-
        Übersetzung: Die App wählt die Richtung (`direction`, Standard `de-en`). Die Lösung
        (Zielsprache) liefert der Server erst nach der ersten Auswertung in dieser Richtung;
        vorher ist sie null und `solution_hidden` ist true. Die Lösung steht zudem in der Antwort
        von POST …/evaluate (`solution.to`). Diktat: `text_de` wird vorgelesen
        (Sprachausgabe der App). Buchstabieren: `lines` mit markierten Wörtern und deren
        Buchstabierung. Gesperrt (Teilumfang) → 403 `CONTENT_LOCKED`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioTextId'
        - in: query
          name: direction
          description: Nur bei Übersetzungen – Übersetzungsrichtung (Standard de-en)
          schema: {type: string, enum: [de-en, en-de]}
      responses:
        '200':
          description: Funktext
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/RadioText'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioText
      summary: Mitschrift/Übersetzung auswerten (und speichern)
      description: >-
        Wortvergleich wie im Web (RadioService::evaluate). Übersetzung: `direction` Pflicht
        (`de-en`/`en-de`), `transcript` = Mitschrift der Ausgangssprache, `translation` = Übersetzung.
        Diktat (UBI): nur `transcript`. Buchstabier-Übungen werden nicht ausgewertet (422).
        Ohne Eingabe → 422. Die Eingaben werden gespeichert (erscheinen in `answers`).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioTextId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direction: {type: string, enum: [de-en, en-de, ''], default: ''}
                transcript: {type: string, maxLength: 5000, default: ''}
                translation: {type: string, maxLength: 5000, default: ''}
      responses:
        '200':
          description: Auswertung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [text_id, transcript, translation, solution]
                    properties:
                      text_id: {type: string}
                      transcript: {oneOf: [{$ref: '#/components/schemas/RadioWordMatch'}, {type: 'null'}]}
                      translation: {oneOf: [{$ref: '#/components/schemas/RadioWordMatch'}, {type: 'null'}]}
                      solution:
                        type: object
                        properties:
                          from: {type: [string, 'null'], description: Ausgangstext (Musterlösung der Mitschrift)}
                          to: {type: [string, 'null'], description: Musterübersetzung}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}/done:
    put:
      tags: [Radio]
      operationId: setRadioTextDone
      summary: Funktext als erledigt markieren (oder zurücksetzen)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioTextId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RadioDoneRequest'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [text_id, done]
                    properties:
                      text_id: {type: string}
                      done: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/vocabulary:
    get:
      tags: [Radio]
      operationId: listRadioVocabulary
      summary: Vokabelkarten eines Funkkatalogs (optional einer Kategorie)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - in: query
          name: catalog
          description: >-
            Funkkatalog. Ohne Angabe gilt der einzige Vokabelkatalog des Kurses; hat der Kurs
            mehrere (SRC und UBI), antwortet die API mit 422.
          schema: {type: string, enum: [SRC, UBI]}
        - in: query
          name: category
          description: Kategorie aus der Übersicht (`vocabulary[].category`), z. B. „Notverkehr“
          schema: {type: string, maxLength: 191}
      responses:
        '200':
          description: Karten
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RadioVocabularyCard'}
                  meta:
                    type: object
                    properties:
                      catalog: {type: string}
                      category: {type: [string, 'null']}
                      total: {type: integer}
                      learned: {type: integer}
                      streak_to_learn: {type: integer}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/vocabulary/{cardId}/answers:
    post:
      tags: [Radio]
      operationId: answerRadioVocabulary
      summary: Vokabel „gewusst“ / „nicht gewusst“
      description: >-
        RadioService::vocabularyAnswer: gewusst → Serie +1, nicht gewusst → 0; gelernt ab
        `streak_to_learn` in Folge (bleibt gelernt). `streak` = die auf der Karte angezeigte Serie:
        weicht der gespeicherte Stand ab (Antwort schon gezählt, z. B. zweites Gerät), wird nichts
        geändert und `repeated: true` geliefert. Ohne `streak`: zweite Antwort innerhalb von
        2 Sekunden wird ignoriert. Zusätzlich optional Idempotency-Key für Netzwiederholungen.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - in: path
          name: cardId
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [known]
              properties:
                known: {type: boolean}
                streak: {type: [integer, 'null'], minimum: 0}
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [card_id, known, streak, learned, repeated]
                    properties:
                      card_id: {type: string}
                      known: {type: boolean}
                      streak: {type: integer}
                      learned: {type: boolean}
                      repeated: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice:
    get:
      tags: [Radio]
      operationId: listRadioPractice
      summary: Funkpraxis-Szenarien je Katalog
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Szenarien
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RadioPracticeCatalog'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}:
    get:
      tags: [Radio]
      operationId: getRadioPractice
      summary: Funkpraxis-Aufgabe (Lage, Eingabefelder, gespeicherte Eingaben – ohne Musterlösung)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioScenarioId'
      responses:
        '200':
          description: Aufgabe
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/RadioPracticeTask'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioPractice
      summary: Funkpraxis auswerten (Prüfpunkte und Musterlösung je Feld)
      description: >-
        RadioPracticeService::evaluate: `answers` = Feldname (`fields[].name`) → Text; unbekannte
        Felder werden ignoriert, Eingaben gespeichert. Ohne Eingabe → 422.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties: {type: string, maxLength: 5000}
      responses:
        '200':
          description: Auswertung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [scenario_id, fields, passed, total]
                    properties:
                      scenario_id: {type: string}
                      passed: {type: integer, description: erfüllte Prüfpunkte}
                      total: {type: integer}
                      fields:
                        type: array
                        items:
                          type: object
                          required: [name, label, checks, solution]
                          properties:
                            name: {type: string}
                            label: {type: string}
                            solution: {type: [string, 'null'], description: Musterlösung des Feldes}
                            checks:
                              type: array
                              items:
                                type: object
                                properties:
                                  label: {type: string}
                                  ok: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/done:
    put:
      tags: [Radio]
      operationId: setRadioPracticeDone
      summary: Funkpraxis-Aufgabe als erledigt markieren (oder zurücksetzen)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RadioDoneRequest'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [scenario_id, done]
                    properties:
                      scenario_id: {type: string}
                      done: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/samples:
    get:
      tags: [Radio]
      operationId: listRadioSamples
      summary: Muster-Funksprüche je Katalog und Meldungsart
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Muster
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [catalog, samples]
                      properties:
                        catalog: {type: string, enum: [SRC, UBI]}
                        samples:
                          type: array
                          items:
                            type: object
                            required: [kind, id, number, locked]
                            properties:
                              kind: {type: string, enum: [distress, acknowledge, relay, false_alert, urgency, urgency_cancel, safety, routine]}
                              id: {type: string}
                              number: {type: integer}
                              locked: {type: boolean}
                              situation: {type: [string, 'null']}
                              message: {type: [string, 'null'], description: Mustermeldung}
                              steps:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    label: {type: string}
                                    text: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /tips:
    get:
      tags: [Tips]
      operationId: listTips
      summary: Tipps & Tricks
      description: >-
        Erweiterung (1.7.0). Dieselben veröffentlichten Tipps wie im Web (`/bootsscheine/tipps/`,
        `GET bootspruefung/v1/tips`, `Tips::groups`): Kategorien in derselben Reihenfolge, je Tipp
        Titel und HTML. Kein Kurszugang nötig (angemeldet genügt), Tenant-Header wie bei `/courses`.
        `html` ist Beitrags-HTML von WordPress, bereinigt mit `wp_kses_post` (wie im Web); zu erwarten
        sind `p`, `br`, `strong`/`b`, `em`/`i`, `a`, `ul`/`ol`/`li`, `h2`–`h4`, `blockquote`, ggf.
        `img`/`figure`/`table`. Relative Links und Bilder sind absolut gemacht. Für Clients ohne
        HTML-Darstellung gibt es `text` (Absätze durch Leerzeile, Listenpunkte „• “) und `links`
        (alle Links des Tipps, z. B. auf Kurse – im Systembrowser bzw. per App-Link öffnen).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: Kategorien mit Tipps (leer, wenn keine veröffentlicht sind)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TipsResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /coupons/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCoupon
      summary: Beitrittscode einer Gruppenlizenz einlösen
      description: >-
        Abweichung: Shop-Käufe schalten den Zugang automatisch frei – es gibt keine per E-Mail
        verschickten Zugangscodes. Eingelöst werden nur Beitrittscodes bzw. Einladungslinks von
        Gruppenlizenzen (`g…`/`i…` mit 32 Hex-Zeichen oder der ganze Link `…/gruppe/<code>/`).
        WooCommerce-Gutscheine sind Rabatte für den Kauf: 422 `COUPON_NOT_SUPPORTED`.
        Unbekannte Codes: 422 `COUPON_INVALID` mit Hinweis auf die automatische Freischaltung.
        Seit 1.7.0 öffnet der Einladungslink `https://<shop>/bootsscheine/gruppe/<token>/` die App
        (App-Link); die App zeigt die Vorschau (`GET /groups/join/{token}`) und löst hier ein –
        Gruppencodes `g…` und persönliche Einladungen `i…` genau wie die Web-Seite
        (`GroupService::join`); erneutes Einlösen als Mitglied liefert 200.
        Limit: 10 Versuche je Stunde. Seit 1.4.0 wird der Idempotency-Key vor dem Limit geprüft:
        Eine Wiederholung mit demselben Key liefert die gespeicherte Antwort, ohne einen Versuch zu
        verbrauchen.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: Eingelöst (oder schon Mitglied)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CouponRedemptionResponse'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /vouchers/check:
    post:
      tags: [Coupons]
      operationId: checkCourseVoucher
      summary: Kursgutschein prüfen (Vorschau, löst nichts ein)
      description: >-
        Seit 1.12.0. Kursgutscheine (z. B. aus dem Voucher-Captain-Shop) schalten einen Kurs frei. Der Nutzer
        ist immer der angemeldete Nutzer des Tokens. Liefert Kursprodukt, Kurse und die geplante Laufzeit je
        Bereich (`starts_at`/`ends_at` ab jetzt; bei vorhandenem befristetem Zugang und Verlängerungsregel
        „verlängern“ ab dessen Ende). Optional `course_id`: gehört der Gutschein zu einem anderen Kurs →
        422 `VOUCHER_WRONG_COURSE`. Fehlercodes wie bei `/vouchers/redeem`. Limit: 30 Versuche je Stunde.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseVoucherRequest'}
      responses:
        '200':
          description: Gutschein einlösbar
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseVoucherResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /vouchers/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCourseVoucher
      summary: Kursgutschein einlösen („Mein Lernen“)
      description: >-
        Seit 1.12.0. Reserviert den Gutschein, schaltet den Kurs über die Produktzuordnung „Lernzugang“ frei
        und verbucht den Gutschein erst danach. Die Laufzeit beginnt mit der Einlösung. Erneutes Senden
        (auch ohne Idempotency-Key) ist sicher: derselbe Gutschein liefert dieselbe Freischaltung
        (`reused: true`), es entsteht nie ein zweiter Zugang. Fehler: 422 `VOUCHER_INVALID` (unbekannt),
        410 `VOUCHER_INVALID` (ungültig gemacht), 409 `VOUCHER_RESERVED` (gerade in einer offenen
        Bestellung o. Ä.), 409 `VOUCHER_REDEEMED`, 410 `VOUCHER_EXPIRED`, 409 `VOUCHER_NOT_YET_VALID`,
        422 `VOUCHER_WRONG_COURSE`, 422 `VOUCHER_NOT_FOR_COURSES` (Shop-Gutschein), 403
        `VOUCHER_NOT_ALLOWED` (für ein anderes Konto), 409 `ACCESS_NOT_POSSIBLE` (Kurs nicht angeboten,
        Kursprodukt entfernt, Kurs schon dauerhaft freigeschaltet – `details.reason` nennt den Grund), 503
        `TEMPORARY_ERROR` mit `retry_after` (Gutschein bleibt erhalten; erneut senden), 503
        `COURSE_VOUCHERS_UNAVAILABLE` (kein Gutschein-Connector aktiv), 429 `RATE_LIMITED`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseVoucherRequest'}
      responses:
        '200':
          description: Kurs freigeschaltet (oder bereits mit diesem Gutschein freigeschaltet)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseVoucherResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /groups/join/{token}:
    get:
      tags: [Groups]
      operationId: previewGroupJoin
      summary: Vorschau eines Einladungs-/Beitrittslinks
      description: >-
        Erweiterung (1.7.0), wie die Web-Seite „Gruppe beitreten“ (`GET bootspruefung/v1/groups/join/{token}`,
        `GroupService::describeToken`): Gruppenname, verwaltende Person, Umfang, freie Plätze, ob es
        ein persönlicher Link ist und ob ein Beitritt möglich ist. Ändert nichts. Beitreten danach mit
        `POST /coupons/redeem` und demselben Token (oder dem ganzen Link). `token` = `g…`
        (Gruppen-Beitrittscode) bzw. `i…` (persönliche Einladung) mit 32 Hex-Zeichen, wie er im
        App-Link `https://<shop>/bootsscheine/gruppe/<token>/` steht. Unbekannt, abgelaufen, schon
        angenommen oder nach „Neuer Link“ ersetzt → 422 `COUPON_INVALID`. Limit: 60 je Stunde.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/JoinToken'
      responses:
        '200':
          description: Vorschau
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupJoinPreviewResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /profile/export:
    post:
      tags: [Privacy]
      operationId: requestDataExport
      summary: Datenexport erstellen (Art. 15/20 DSGVO)
      description: >-
        **Seit 1.4.0 asynchron (Vertragsänderung):** Antwort 202 mit `status: pending` und
        `download_url: null`; der Server erstellt den Export im Hintergrund (Action Scheduler bzw.
        WP-Cron). Die App fragt `GET /profile/export/{exportId}` ab (z. B. alle 2–5 Sekunden, mit
        Rückoff), bis `status` `ready` (dann `download_url`) oder `failed` (neu anfordern) ist.
        Wartet ein Export länger als 30 Sekunden, erstellt ihn die Statusabfrage selbst.
        Inhalt: alle WordPress-Datenexporte – Lernstand, Prüfungen, Zugänge, App-Sitzungen und
        App-Einstellungen dieses Plugins, WordPress-Konto, WooCommerce (Kundendaten, Bestellungen).
        Gespeichert in der Datenbank (kein öffentlicher Upload-Ordner), nur mit Anmeldung
        abrufbar, 24 Stunden nach Fertigstellung automatisch gelöscht. Ein neuer Export ersetzt
        den vorherigen. Limit: 5 je Tag. Bis 1.3.x kam sofort `status: ready`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Export angelegt (`pending`) bzw. gespeicherte Antwort bei gleichem Idempotency-Key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportStatusResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}:
    get:
      tags: [Privacy]
      operationId: getDataExport
      summary: Exportstatus und Download-Adresse
      description: >-
        `pending` (wird erstellt, `download_url` null) → `ready` (`download_url` gesetzt) oder
        `failed` (Fehler bei der Erstellung, neu anfordern); `expired` nach Ablauf. Wartet der Export
        länger als 30 Sekunden, erstellt diese Abfrage ihn selbst (kann dann einige Sekunden dauern).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportStatusResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}/download:
    get:
      tags: [Privacy]
      operationId: downloadDataExport
      summary: Export als JSON herunterladen (nur Eigentümer, mit Bearer-Token)
      description: >-
        Erweiterung (ersetzt den öffentlichen, tokenbasierten Download des Konzepts). Kein
        Tenant-Header nötig. Noch nicht fertig → 409 `EXPORT_NOT_READY` (mit `retry_after`);
        fehlgeschlagen → 410 `EXPORT_FAILED`; abgelaufen → 410 `EXPORT_EXPIRED`. Keine
        Teil-Downloads (`Accept-Ranges: none`, kleine JSON-Datei); `Content-Disposition: attachment;
        filename="…"; filename*=UTF-8''…`.
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: JSON-Datei (Content-Disposition attachment)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportFile'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /files/{fileId}:
    get:
      tags: [Files]
      operationId: downloadProtectedFile
      summary: Geschützte Kursdatei oder Seekarte herunterladen
      description: >-
        Erweiterung. Gleiche Freigabe wie /bootsscheine/datei/<id>/ im Web (Kurs-PDFs,
        lizenzierte Seekarten nur mit vollem Navigationszugang), aber mit Bearer-Token.
        URLs kommen aus Kursdetails (`downloads`, `section_files`, `charts`) und Navigationsaufgaben.
        Kein Tenant-Header nötig. Seit 1.4.0: `Accept-Ranges: bytes`; mit `Range: bytes=<von>-<bis>`
        (genau ein Bereich, auch `bytes=<von>-` und `bytes=-<letzte N>`) 206 mit `Content-Range`
        (z. B. Download fortsetzen). Mehrere Bereiche, fehlerhafte oder nicht erfüllbare Angaben → 416
        `RANGE_NOT_SATISFIABLE` mit `Content-Range: bytes */<Größe>`. Mit `If-Range` wird immer die
        ganze Datei geliefert. `Content-Disposition: inline; filename="<ASCII>"; filename*=UTF-8''<Name>`.
      parameters:
        - in: path
          name: fileId
          required: true
          schema: {type: string}
        - in: header
          name: Range
          required: false
          schema: {type: string, examples: ['bytes=1048576-']}
      responses:
        '200':
          description: Datei
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '206':
          description: Teilinhalt (Range)
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '416': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque (bpa_…)
      description: Access-Token aus /auth/login bzw. /auth/refresh; gilt 15 Minuten und nur für diesen Namespace.
  parameters:
    TenantSlug:
      in: header
      name: X-Tenant-Slug
      required: true
      description: Slug aus `memberships[].tenant_slug`. Fehlt er → 422, passt er nicht → 403 `TENANT_MEMBERSHIP_REQUIRED`. Kein Berechtigungsnachweis.
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID. Gleicher Schlüssel und gleicher Inhalt → gespeicherte Antwort; gleicher Schlüssel, anderer Inhalt → 409 `IDEMPOTENCY_KEY_REUSED`. Aufbewahrung 7 Tage.
      schema: {type: string, format: uuid}
    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      description: Optional (Vorgang ist ohnehin wiederholbar); mit Schlüssel wie IdempotencyKey.
      schema: {type: string, format: uuid}
    Page:
      in: query
      name: page
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      in: query
      name: per_page
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    CourseId:
      in: path
      name: courseId
      required: true
      description: Numerische Kurs-ID (bp_course.id); der Kurscode (z. B. sbf-see) wird ebenfalls akzeptiert.
      schema: {type: string}
    CollectionId:
      in: path
      name: collectionId
      required: true
      schema: {type: string}
    QuestionId:
      in: path
      name: questionId
      required: true
      schema: {type: string}
    ExamQuestionPosition:
      in: path
      name: questionId
      required: true
      description: Position der Frage in der Prüfung (1…n) = `questions[].id` der laufenden Prüfung.
      schema: {type: string}
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: {type: string}
    ExamId:
      in: path
      name: examId
      required: true
      schema: {type: string}
    LessonId:
      in: path
      name: lessonId
      required: true
      schema: {type: string}
    TaskId:
      in: path
      name: taskId
      required: true
      schema: {type: string}
    RadioTextId:
      in: path
      name: textId
      required: true
      description: Quell-ID des Funktexts, z. B. TXT-SRC-01, UBI-AUF-01
      schema: {type: string, pattern: '^[A-Za-z0-9-]{1,64}$'}
    RadioScenarioId:
      in: path
      name: scenarioId
      required: true
      description: Quell-ID des Funkpraxis-Szenarios, z. B. SRC-01
      schema: {type: string, pattern: '^[A-Za-z0-9-]{1,64}$'}
    GroupId:
      in: path
      name: groupId
      required: true
      schema: {type: string}
    MemberId:
      in: path
      name: memberId
      required: true
      description: '`members[].id` der Gruppe (Mitglied oder Einladung)'
      schema: {type: string}
    JoinToken:
      in: path
      name: token
      required: true
      description: Beitrittscode `g…` oder persönliche Einladung `i…` (32 Hex-Zeichen) aus dem Link `…/gruppe/<token>/`
      schema: {type: string, pattern: '^[A-Za-z0-9]{1,64}$'}
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: {type: string}
    ExportId:
      in: path
      name: exportId
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  responses:
    Problem:
      description: Fehlerantwort (RFC-9457-Stil)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, message, request_id]
      properties:
        type: {type: string, format: uri, examples: ['urn:bootspruefung:problem:entitlement-expired']}
        title: {type: string}
        status: {type: integer}
        detail: {type: string, description: Deutsche Meldung (Du-Form)}
        message: {type: string, description: 'Gleich detail (Erweiterung, für einfache Clients)'}
        code:
          type: string
          enum: [UNAUTHENTICATED, REFRESH_TOKEN_REUSED, REFRESH_TOKEN_ROTATED, PASSWORD_RESET_INVALID_OR_EXPIRED, TENANT_MEMBERSHIP_REQUIRED, ENTITLEMENT_REQUIRED, ENTITLEMENT_EXPIRED, ENTITLEMENT_SUSPENDED, CONTENT_LOCKED, RESOURCE_NOT_FOUND, VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS, QUESTION_TOKEN_EXPIRED, EXAM_NOT_STARTABLE, EXAM_ALREADY_SUBMITTED, EXAM_NOT_SUBMITTED, EXAM_ABORTED, EXAM_EXPIRED, EXAM_ANSWER_LOCKED, COUPON_INVALID, COUPON_NOT_SUPPORTED, GROUP_NOT_ACTIVE, EXPORT_EXPIRED, EXPORT_NOT_READY, EXPORT_FAILED, RANGE_NOT_SATISFIABLE, DELETION_CONFIRMATION_INVALID, VERSION_CONFLICT, WEB_SESSION_DISABLED, WEB_SESSION_NOT_ALLOWED, RATE_LIMITED, MOBILE_API_DISABLED, HTTPS_REQUIRED, APP_UPDATE_REQUIRED, METHOD_NOT_ALLOWED, INTERNAL_ERROR]
        request_id: {type: string}
        errors:
          type: object
          description: Feldfehler (bei VALIDATION_FAILED)
          additionalProperties:
            type: array
            items: {type: string}
        details:
          type: object
          description: "Zusatzinfos, z. B. bei ENTITLEMENT_*: course_id, capability, access_status, webshop_url"
          additionalProperties: true
        retry_after: {type: integer, description: Sekunden (auch als Header Retry-After)}
    TokenPair:
      type: object
      required: [access_token, token_type, access_expires_at, expires_in, refresh_token, refresh_expires_at, session_id]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        access_expires_at: {type: string, format: date-time, description: 15 Minuten nach Ausgabe}
        expires_in: {type: integer, description: Sekunden bis zum Ablauf des Access-Tokens}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time, description: '30 Tage Inaktivität, höchstens 90 Tage ab Anmeldung'}
        session_id: {type: string}
    TokenPairResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TokenPair'}
    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: {type: string, description: E-Mail-Adresse oder Benutzername}
        password: {type: string, minLength: 1, writeOnly: true}
        device_name: {type: string, minLength: 1, maxLength: 100}
        device_platform: {type: [string, 'null'], enum: [ios, android, null]}
        app_version: {type: [string, 'null'], maxLength: 40}
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - {$ref: '#/components/schemas/TokenPair'}
            - {$ref: '#/components/schemas/Profile'}
    User:
      type: object
      required: [id, name, email, email_verified]
      properties:
        id: {type: string}
        name: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: string, format: email}
        email_verified:
          type: boolean
          const: true
          description: >-
            Immer true. Shop-Konten brauchen keine E-Mail-Bestätigung; die App bietet keinen
            Bestätigungsablauf an (der Endpunkt `/auth/email/verification-notification` des Konzepts
            entfällt seit 1.1.0).
    Membership:
      type: object
      required: [tenant_slug, tenant_name, status, role, branding]
      properties:
        tenant_slug: {type: string}
        tenant_name: {type: string, description: Markenname aus den Plugin-Einstellungen}
        status: {type: string, const: active}
        role: {type: string, const: learner}
        branding: {$ref: '#/components/schemas/Branding'}
        links:
          type: object
          description: Erweiterung – Web-Seiten zum Öffnen im Systembrowser
          properties:
            web_learning: {type: string, format: uri}
            shop: {type: [string, 'null'], format: uri}
            account: {type: [string, 'null'], format: uri}
            privacy_policy: {type: [string, 'null'], format: uri}
            imprint: {type: [string, 'null'], format: uri, description: seit 1.8.0}
            terms: {type: [string, 'null'], format: uri, description: seit 1.8.0}
            withdrawal_policy: {type: [string, 'null'], format: uri, description: seit 1.8.0}
            withdrawal_function: {type: [string, 'null'], format: uri, description: 'seit 1.8.0, Widerrufsbutton (§ 356a BGB)'}
            contact: {type: [string, 'null'], format: uri, description: seit 1.8.0}
    Branding:
      type: object
      properties:
        logo_url: {type: [string, 'null'], format: uri}
        primary_color: {type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$'}
        support_email: {type: [string, 'null'], format: email}
    Profile:
      type: object
      required: [user, memberships]
      properties:
        user: {$ref: '#/components/schemas/User'}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
    MeResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Profile'}
    DeviceSession:
      type: object
      required: [id, device_name, created_at, last_used_at, current]
      properties:
        id: {type: string}
        device_name: {type: string}
        device_platform: {type: [string, 'null'], enum: [ios, android, null]}
        app_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        current: {type: boolean}
    WebSessionRequest:
      type: object
      required: [redirect]
      properties:
        redirect:
          type: string
          maxLength: 400
          description: Ziel im Lernbereich, z. B. /bootsscheine/src/funk/geraet/ (= device_simulator.web_url)
          examples: [/bootsscheine/src/funk/geraet/]
    WebSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, expires_at, expires_in, redirect, verifier, verifier_header]
          properties:
            url: {type: string, format: uri, description: 'Einmal-URL (enthält den Code; sofort öffnen, nicht speichern)'}
            expires_at: {type: string, format: date-time}
            expires_in: {type: integer, const: 60}
            redirect: {type: string, format: uri, description: Ziel nach der Anmeldung (ohne Code)}
            verifier:
              type: string
              pattern: '^bpv_[A-Za-z0-9_-]{43}$'
              description: 'Seit 1.4.0: Prüfwert, den die Webansicht beim Laden von url als Header verifier_header mitsendet (nicht in die URL, nicht speichern)'
            verifier_header: {type: string, const: X-Boatingschool-Web-Verifier, description: Seit 1.4.0}
    AppSettings:
      type: object
      description: Von der App definiert; Schlüssel ^[a-z0-9_.-]{1,64}$, höchstens 4 Ebenen, 8192 Bytes.
      propertyNames: {pattern: '^[a-z0-9_.-]{1,64}$'}
      additionalProperties: true
      examples:
        - {theme: dark, audio.volume: 0.8, trainer: {daily_goal: 20}}
    AppSettingsState:
      type: object
      required: [settings, version, updated_at]
      properties:
        settings: {$ref: '#/components/schemas/AppSettings'}
        version: {type: integer, minimum: 0, description: 0 = noch nie gespeichert; steigt bei jedem PUT um 1}
        updated_at: {type: [string, 'null'], format: date-time}
    AppSettingsRequest:
      type: object
      required: [settings]
      properties:
        settings: {$ref: '#/components/schemas/AppSettings'}
        expected_version: {type: [integer, 'null'], minimum: 0, description: Alternative zu If-Match}
    AppSettingsResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/AppSettingsState'}
    DeletionRequestResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [request_id, status, already_requested, message]
          properties:
            request_id: {type: string}
            status:
              type: string
              enum: [pending_confirmation, confirmed, completed]
              description: >-
                pending_confirmation = Mail verschickt; confirmed = bestätigt, der Shop bearbeitet den
                Antrag; completed = ausgeführt (Konto gelöscht, Tokens ungültig).
            already_requested: {type: boolean}
            message: {type: string}
    Entitlement:
      type: object
      required: [status, valid_from, valid_until]
      properties:
        status:
          type: string
          description: >-
            active = voller Zugang zu mindestens einem Bereich; pending (Erweiterung) = Kauf wartet auf
            Zahlung (Screen 88); suspended = gesperrt, z. B. Zahlungsstreit/Rückbuchung (Screen 89);
            expired = Kauf abgelaufen (Screen 25); limited (Erweiterung) = nur kostenloser Teilumfang;
            revoked aus den Zugängen; not_granted = kein Zugang. Seit 1.11.0 haben pending, suspended
            und expired Vorrang vor limited – der Teilumfang bleibt nutzbar (trial, limits, features).
          enum: [active, limited, pending, expired, suspended, revoked, not_granted]
        valid_from: {type: [string, 'null'], format: date-time}
        valid_until: {type: [string, 'null'], format: date-time, description: null = unbegrenzt bzw. ohne Kauf}
        trial: {type: boolean}
        purchased: {type: boolean, description: 'Es gibt einen gültigen Zugang (Kauf, Gruppe, manuell).'}
        limits:
          type: object
          description: Fähigkeit → Limit im Teilumfang (z. B. smarttrainer = Fragen je Modul, exam = Bögen)
          additionalProperties: {type: integer}
        expires_soon:
          type: boolean
          description: >-
            Seit 1.9.0. Der Zugang zum Fragenkatalog endet in höchstens N Tagen (Admin-Einstellung
            „Tage vorher“, Standard 14) und es gibt keinen späteren oder unbefristeten Zugang
            (z. B. Verlängerung). Kostenloser Teilumfang: immer false. Die App zeigt dann „Dein Zugang
            zu {Kurs} endet am {Datum}. Dein Lernstand bleibt erhalten.“ mit „Jetzt verlängern“.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: Seit 1.9.0. Ende des Fragenkatalog-Zugangs, nur wenn expires_soon (sonst null).
        renew_url:
          type: [string, 'null']
          format: uri
          description: >-
            Seit 1.9.0 bei expires_soon, seit 1.11.0 auch bei status expired (sonst null): die gekaufte
            Stufe (Theorie bzw. Komplett, wenn der Videokurs dabei war; Kombi, Bundle, Pass), sonst das
            erste passende Shop-Angebot für den Fragenkatalog, ohne Shop die Kursseite im
            Web-Lernbereich. Im Systembrowser öffnen.
        order_number:
          type: [string, 'null']
          description: Seit 1.11.0. Nur bei status pending - Nummer der offenen Bestellung.
        order_url:
          type: [string, 'null']
          format: uri
          description: >-
            Seit 1.11.0. Nur bei status pending: Bestellansicht in „Mein Konto“ (dort stehen die
            Zahlungsdaten). Im Systembrowser öffnen.
        duration_days:
          type: [integer, 'null']
          description: >-
            Seit 1.11.0. Nur bei status pending: Laufzeit ab Zahlungseingang in Tagen (z. B. 365 =
            „12 Monate ab Zahlungseingang“); null = unbefristet bzw. andere Status.
        contact_url:
          type: [string, 'null']
          format: uri
          description: Seit 1.11.0. Nur bei status suspended - Kontaktseite (wie legal.contact), sonst null.
    CourseRelation:
      type: object
      required: [hidden, recommended, recommended_for]
      description: >-
        Seit 1.9.0. Empfehlung und Ausblenden von Doppeltem. Grundlage sind die besessenen Kurse
        (gültiger Zugang zum Fragenkatalog durch Kauf, manuell oder Gruppe; der kostenlose
        Teilumfang zählt nicht) und eine feste Tabelle (Server: CourseRelations, Filter
        `bootspruefung_course_relations`). Kurse mit vollem Fragenkatalog sind nie ausgeblendet oder empfohlen.
      properties:
        hidden:
          type: boolean
          description: >-
            Nicht freigeschaltet und durch einen besessenen Kurs schon abgedeckt (z. B. SBF See & Binnen
            für Besitzer von SBF Binnen). Nicht mehr anbieten; der Kurs bleibt in der Liste und über seine ID erreichbar.
            Testkurse (kostenloser Teilumfang, access.trial) sind nie ausgeblendet.
        recommended:
          type: boolean
          description: Passende Ergänzung zu einem besessenen Kurs (nie zusammen mit hidden).
        recommended_for:
          type: array
          description: Besessene Kurse, die die Empfehlung auslösen (für „Passt zu deinem Kurs …“).
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
    FeatureAccess:
      type: object
      required: [available, full]
      properties:
        available: {type: boolean, description: voll oder im Teilumfang nutzbar}
        full: {type: boolean}
        limit: {type: [integer, 'null']}
    ProgressSummary:
      type: object
      required: [percent, completed, total]
      properties:
        percent: {type: integer, minimum: 0, maximum: 100, description: Anteil gefestigter Fragen}
        completed: {type: integer, minimum: 0, description: gefestigte Fragen}
        total: {type: integer, minimum: 0, description: Fragen im freigeschalteten Umfang}
        new: {type: integer}
        unsure: {type: integer}
        learning: {type: integer, description: 'In Bearbeitung; enthält seit 1.11.0 auch „sicher heute“ (secure), damit new + unsure + learning + mastered = total bleibt'}
        mastered: {type: integer, description: 'Gefestigt (seit 1.11.0: drei richtige in Folge und eine weitere richtige Antwort an einem anderen Tag)'}
        secure: {type: integer, minimum: 0, description: 'Seit 1.11.0: „sicher heute“ – drei richtige Antworten in Folge, noch nicht an einem anderen Tag bestätigt (in learning enthalten)'}
        secure_percent: {type: integer, minimum: 0, maximum: 100, description: 'Seit 1.11.0: Anteil „sicher heute“'}
        due: {type: integer, minimum: 0, description: 'Seit 1.11.0: sichere bzw. gefestigte Fragen, deren Wiederholung jetzt fällig ist'}
    CourseSummary:
      type: object
      required: [id, code, name, access, progress, capabilities, features, webshop_url]
      properties:
        id: {type: string}
        code: {type: string}
        slug: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        course_type: {type: string, enum: [full, combo, addon]}
        access: {$ref: '#/components/schemas/Entitlement'}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        capabilities:
          type: array
          description: Bereiche, die der Kurs enthält (unabhängig vom Zugang)
          items: {type: string, enum: [smarttrainer, favorites, exam, video, navigation, praxis, funk]}
        features:
          type: object
          description: Fähigkeit → Zugriff (zusätzlich `explanations` für Erklärungen nach der Antwort)
          additionalProperties: {$ref: '#/components/schemas/FeatureAccess'}
        webshop_url:
          type: [string, 'null']
          format: uri
          description: Passendstes WooCommerce-Angebot (günstigstes Produkt mit dem Hauptbereich), nur ohne Vollzugang.
        relation: {$ref: '#/components/schemas/CourseRelation'}
        faq_count:
          type: integer
          minimum: 0
          description: 'Seit 1.10.0: Anzahl der Kunden-FAQs (`GET /courses/{courseId}/faqs`), die der Kunde sieht; 0 ohne vollen Zugang zum Fragenkatalog.'
    CourseListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/CourseSummary'}
        meta:
          type: object
          properties:
            tenant:
              type: object
              properties:
                slug: {type: string}
                name: {type: string}
            pagination: {$ref: '#/components/schemas/Pagination'}
    Pagination:
      type: object
      properties:
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    Offer:
      type: object
      properties:
        name: {type: string}
        url: {type: string, format: uri}
        price: {type: string}
    FileRef:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        size_bytes: {type: [integer, 'null']}
        locked: {type: boolean}
        url: {type: [string, 'null'], format: uri, description: 'API-Adresse /files/{id} (Bearer-Token nötig)'}
        requires_authorization: {type: boolean}
    CourseDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - {$ref: '#/components/schemas/CourseSummary'}
            - type: object
              properties:
                modules_count: {type: integer}
                exam_options_count: {type: integer}
                favorites_count: {type: integer}
                trainers: {type: object, additionalProperties: true, description: Zähler der Trainer wie auf der Web-Kursseite}
                offers:
                  type: object
                  description: Fähigkeit → Kaufangebote für gesperrte Bereiche
                  additionalProperties:
                    type: array
                    items: {$ref: '#/components/schemas/Offer'}
                downloads:
                  type: array
                  items: {$ref: '#/components/schemas/FileRef'}
                section_files:
                  type: object
                  additionalProperties:
                    type: array
                    items: {$ref: '#/components/schemas/FileRef'}
                charts:
                  type: array
                  items: {$ref: '#/components/schemas/FileRef'}
                web_url: {type: string, format: uri}
                device_simulator: {$ref: '#/components/schemas/DeviceSimulatorLink'}
                knots:
                  description: >-
                    Videokapitel „Knoten“ als eigener Bereich (Kachel wie im Web); null, wenn der Kurs keines hat.
                    Lektionen über GET /courses/{courseId}/videos (Kapitel mit id = module_id). Ohne Videozugang
                    gesperrt mit Anzahl der Lektionen und Shop-Link. Seit 1.5.0.
                  oneOf:
                    - type: object
                      required: [available, locked, module_id, lessons, completed, unlock_at, webshop_url]
                      properties:
                        available: {type: boolean}
                        locked: {type: boolean, description: 'ohne Videozugang oder Kapitel noch nicht freigegeben (unlock_at)'}
                        module_id: {type: string}
                        lessons: {type: integer}
                        completed: {type: integer}
                        unlock_at: {type: [string, 'null'], format: date-time}
                        webshop_url: {type: [string, 'null'], format: uri}
                    - type: 'null'
                exam_registration:
                  type: object
                  required: [available, web_url]
                  description: Erweiterung. Inhalte über GET /courses/{courseId}/exam-registration.
                  properties:
                    available: {type: boolean}
                    web_url: {type: [string, 'null'], format: uri, description: Web-Seite „Prüfung anmelden“}
    Topic:
      type: object
      properties:
        name: {type: string}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
    Module:
      type: object
      required: [id, code, name, order, question_count, locked, progress]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        order: {type: integer}
        question_count: {type: integer, description: Fragen im freigeschalteten Umfang}
        catalog_count: {type: integer, description: Fragen im gesamten Katalog des Moduls}
        locked: {type: boolean}
        lock_reason: {type: [string, 'null'], enum: [drip, trial, null]}
        unlock_at: {type: [string, 'null'], format: date-time}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        topics:
          type: array
          items: {$ref: '#/components/schemas/Topic'}
    CourseOverviewResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [course, progress, modules]
          properties:
            course: {$ref: '#/components/schemas/CourseSummary'}
            progress: {$ref: '#/components/schemas/ProgressSummary'}
            continue_learning:
              oneOf:
                - type: object
                  required: [module_id, module_name, mode, topic, open, unsure, trainer_query]
                  description: >-
                    „Dein nächster Schritt“: erstes freigegebenes, noch nicht gefestigtes Modul und darin das erste
                    nicht gefestigte Thema. trainer_query sind die Parameter für GET /courses/{courseId}/trainer/next.
                  properties:
                    module_id: {type: string}
                    module_name: {type: string}
                    mode: {type: string, const: smarttrainer}
                    topic: {type: [string, 'null'], description: 'Thema innerhalb des Moduls (seit 1.5.0)'}
                    open: {type: integer, description: 'Fragen des Moduls, die noch nicht gefestigt sind (seit 1.5.0)'}
                    unsure: {type: integer, description: 'davon unsicher/falsch beantwortet (seit 1.5.0)'}
                    trainer_query:
                      type: object
                      description: seit 1.5.0
                      required: [mode, module_id]
                      properties:
                        mode: {type: string, enum: [topic, module]}
                        module_id: {type: string}
                        topic: {type: string}
                - type: 'null'
            modules:
              type: array
              items: {$ref: '#/components/schemas/Module'}
            limit: {type: [integer, 'null'], description: Fragen je Modul im Teilumfang (null = unbegrenzt)}
    ProgressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [overall, modules]
          properties:
            overall: {$ref: '#/components/schemas/ProgressSummary'}
            modules:
              type: array
              items: {$ref: '#/components/schemas/Module'}
            limit: {type: [integer, 'null']}
    Media:
      type: object
      required: [kind, available, label, url]
      properties:
        kind: {type: string, enum: [image, video, audio, document, placeholder]}
        placeholder_for: {type: string, description: Bei kind=placeholder – image oder video}
        available: {type: boolean}
        label: {type: string, description: Alt-Text bzw. „Video folgt“/„Bild folgt“}
        alt: {type: [string, 'null']}
        caption: {type: [string, 'null']}
        url: {type: [string, 'null'], format: uri, description: Für Platzhalter null}
        mime_type: {type: [string, 'null']}
        width: {type: [integer, 'null']}
        height: {type: [integer, 'null']}
        duration_seconds: {type: [integer, 'null']}
        placeholder_reason: {type: [string, 'null'], enum: [awaiting_asset, unavailable, null]}
    QuestionAnswerOption:
      type: object
      required: [id, label, text]
      properties:
        id: {type: string}
        label: {type: string, description: 'A, B, C … (Reihenfolge je Auslieferung gemischt)'}
        text: {type: string}
        media: {type: array, items: {$ref: '#/components/schemas/Media'}}
    Question:
      type: object
      required: [id, text, answers, answer_selection]
      properties:
        id: {type: string, description: Fragen-ID; in laufenden Prüfungen die Position (1…n)}
        revision_id: {type: [string, 'null']}
        official_number: {type: [string, 'null']}
        text: {type: string}
        prompt_media: {type: array, items: {$ref: '#/components/schemas/Media'}}
        answers: {type: array, items: {$ref: '#/components/schemas/QuestionAnswerOption'}}
        answer_selection: {type: string, enum: [single, multiple, open], description: open = Musterantwort und Selbsteinschätzung „gewusst/nicht gewusst“}
        type: {type: string, enum: [single_choice, multi_choice, open_text]}
        topic: {type: [string, 'null']}
        module_id: {type: [string, 'null']}
    LearningProgress:
      type: object
      properties:
        learning_status: {type: string, enum: [new, unsure, learning, mastered], description: Lernstatus wie im Web}
        learning_state: {type: string, enum: [neu, in_bearbeitung, gefestigt], description: Abbildung auf den Konzept-Wertebereich}
        stage: {type: string, enum: [new, unsure, learning, secure, mastered], description: 'Seit 1.11.0: Lernstufe mit „sicher heute“ (secure; learning_status meldet dafür weiterhin learning)'}
        due_at: {type: [string, 'null'], format: date-time, description: 'Seit 1.11.0: nächste Wiederholung (ab secure frühestens 20 h später gefestigt; gefestigt: nach 7, 21, dann 60 Tagen)'}
        streak: {type: integer, minimum: 0}
        streak_required: {type: integer, const: 3}
        attempts: {type: integer, minimum: 0}
    TrainerQuestionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [question, answer_token, mode, progress]
          properties:
            question: {$ref: '#/components/schemas/Question'}
            answer_token: {type: string, description: 'Signierte Auslieferung (Revision, Antwortreihenfolge, Konto); 2 Stunden gültig'}
            answer_token_expires_in: {type: integer}
            mode: {type: string}
            selection_reason: {type: [string, 'null']}
            favorite: {type: boolean}
            progress: {$ref: '#/components/schemas/LearningProgress'}
            remaining: {type: [integer, 'null'], description: verbleibende Fragen im Modus (nicht im Smarttrainer)}
    TrainerAnswerRequest:
      type: object
      required: [answer_token]
      properties:
        answer_token: {type: string}
        question_id: {type: [string, 'null'], description: 'optional, wird gegen das Token geprüft'}
        revision_id: {type: [string, 'null'], description: 'optional, wird gegen das Token geprüft'}
        selected_answer_ids:
          type: array
          uniqueItems: true
          items: {type: string}
        known: {type: [boolean, 'null'], description: Pflicht bei offenen Fragen (gewusst/nicht gewusst)}
        mode: {type: [string, 'null']}
        response_ms: {type: [integer, 'null'], minimum: 0}
        client_answered_at: {type: [string, 'null'], format: date-time, description: 'nur Telemetrie, wird nicht ausgewertet'}
    TrainerAnswerResult:
      type: object
      required: [attempt_id, question_id, correct, selected_answer_ids, correct_answer_ids, explanation, learning_status, learning_state, completed, progress]
      properties:
        attempt_id: {type: string}
        question_id: {type: string}
        revision_id: {type: string}
        correct: {type: boolean}
        selected_answer_ids: {type: array, items: {type: string}}
        correct_answer_ids: {type: array, items: {type: string}}
        model_answer: {type: [string, 'null']}
        explanation: {type: [string, 'null'], description: null ohne Zugang zu Erklärungen}
        explanation_locked: {type: boolean}
        learning_status: {type: string, enum: [new, unsure, learning, mastered]}
        learning_state: {type: string, enum: [neu, in_bearbeitung, gefestigt]}
        completed: {type: boolean, description: 'true, sobald die Frage gefestigt ist (seit 1.11.0: 3 richtige in Folge und eine weitere richtige an einem anderen Tag)'}
        streak_counted: {type: [boolean, 'null'], description: 'Ob die richtige Antwort die Serie erhöht hat (Abstand; ab „sicher heute“ nur bei fälliger Wiederholung)'}
        repeated: {type: boolean}
        progress: {$ref: '#/components/schemas/LearningProgress'}
    TrainerAnswerResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TrainerAnswerResult'}
    FavoriteBase:
      type: object
      required: [question_id, context, collection_ids]
      properties:
        question_id: {type: string}
        context: {type: string, const: smart_learning}
        favorite: {type: boolean}
        wrong: {type: boolean}
        collection_id: {type: [string, 'null'], description: erste Sammlung (Kompatibilität)}
        collection_ids: {type: array, items: {type: string}}
        official_number: {type: [string, 'null']}
        text: {type: string}
        module: {type: string}
        topic: {type: [string, 'null']}
    Favorite:
      allOf:
        - {$ref: '#/components/schemas/FavoriteBase'}
        - type: object
          required: [saved_at, created_at]
          properties:
            saved_at: {type: string, format: date-time, description: 'Gespeichert am (UTC), nie null'}
            assigned_at:
              type: string
              format: date-time
              description: 'Nur bei Filter collection_id (dann immer gesetzt): in diese Sammlung einsortiert am (UTC)'
            created_at: {type: string, format: date-time, deprecated: true, description: 'Veraltet: gleich saved_at'}
    Mistake:
      allOf:
        - {$ref: '#/components/schemas/FavoriteBase'}
        - type: object
          required: [saved_at]
          properties:
            saved_at: {type: [string, 'null'], format: date-time, description: 'null, wenn die Frage kein Favorit ist'}
            created_at: {type: [string, 'null'], format: date-time, deprecated: true}
    FavoritesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Favorite'}
        meta:
          type: object
          required: [sort, order, collections]
          properties:
            sort: {type: string, enum: [saved_at, assigned_at]}
            order: {type: string, enum: [desc, asc]}
            collection_id: {type: [string, 'null']}
            collections:
              type: array
              items: {$ref: '#/components/schemas/FavoriteCollection'}
    MistakesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Mistake'}
    FavoriteResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [question_id, context, collection_ids, saved_at]
          properties:
            question_id: {type: string}
            context: {type: string, const: smart_learning}
            collection_id: {type: [string, 'null']}
            collection_ids: {type: array, items: {type: string}}
            saved_at: {type: string, format: date-time}
            created_at: {type: string, format: date-time, deprecated: true}
    FavoriteCollection:
      type: object
      required: [id, name, favorite_count]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 60}
        favorite_count: {type: integer}
        created_at: {type: [string, 'null'], format: date-time}
    FavoriteCollectionRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}
    FavoriteCollectionResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/FavoriteCollection'}
    FavoriteCollectionsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/FavoriteCollection'}
    DeviceSimulatorLink:
      type: object
      required: [available, premium, tier, web_url, open_in, hint, webshop_url]
      description: >-
        Erweiterung. Der Funkgerät-Simulator hat keine App-API (Bedienung nur im Web-Lernbereich).
        Die App zeigt den Hinweis „am Tablet oder im Browser öffnen“ und öffnet `web_url` im
        Systembrowser; dort meldet sich der Nutzer mit demselben Konto an (keine Sitzungsübergabe).
      properties:
        available: {type: boolean, description: 'DeviceSimService::available – Funkkurs mit Simulator (mind. Testversion)'}
        premium: {type: boolean, description: 'DeviceSimService::premium – Vollversion freigeschaltet'}
        tier: {type: [string, 'null'], enum: [free, premium, null]}
        web_url: {type: [string, 'null'], format: uri, description: '…/bootsscheine/<kurs>/funk/geraet/'}
        open_in: {type: string, const: browser}
        hint: {type: [string, 'null']}
        webshop_url: {type: [string, 'null'], format: uri, description: Angebot für die Vollversion (nur Testversion)}
        lessons: {type: integer, description: 'Nur in der Funk-Übersicht: sichtbare Lektionen (Testversion: nur die freien)'}
        mastered: {type: integer, description: 'Nur in der Funk-Übersicht: davon allein gemeistert (Stufe 3)'}
    RadioOverview:
      type: object
      required: [course_id, catalogs, texts, vocabulary, practice, device_simulator]
      properties:
        course_id: {type: string}
        catalogs: {type: array, items: {type: string, enum: [SRC, UBI]}}
        texts:
          type: array
          items:
            type: object
            required: [catalog, type, items]
            properties:
              catalog: {type: string, enum: [SRC, UBI]}
              type: {type: string, enum: [translation, dictation, spelling], description: 'SRC: Übersetzung; UBI: Aufnahme (Diktat) und Abgabe (Buchstabieren)'}
              items:
                type: array
                items:
                  type: object
                  required: [id, number, done, locked]
                  properties:
                    id: {type: string}
                    number: {type: integer}
                    direction: {type: [string, 'null'], description: 'Funkverkehr land/see (SRC)'}
                    teaser: {type: [string, 'null'], description: null bei gesperrten Übungen}
                    done: {type: boolean}
                    locked: {type: boolean}
        vocabulary:
          type: array
          items:
            type: object
            required: [catalog, category, total, learned]
            properties:
              catalog: {type: string, enum: [SRC, UBI]}
              category: {type: string}
              total: {type: integer}
              learned: {type: integer}
        practice:
          type: array
          items: {$ref: '#/components/schemas/RadioPracticeCatalog'}
        device_simulator: {$ref: '#/components/schemas/DeviceSimulatorLink'}
    RadioText:
      type: object
      required: [id, course_id, catalog, type, number, translation_direction, solution_hidden, evaluable, answers, done]
      properties:
        id: {type: string}
        course_id: {type: string}
        catalog: {type: string, enum: [SRC, UBI]}
        type: {type: string, enum: [translation, dictation, spelling]}
        number: {type: integer}
        direction: {type: [string, 'null'], description: 'Funkverkehrsrichtung (land/see), nicht die Übersetzungsrichtung'}
        translation_direction: {type: [string, 'null'], enum: [de-en, en-de, null], description: 'Nur bei Übersetzungen: die angefragte Richtung'}
        solution_hidden: {type: boolean, description: 'true, solange die Zielsprache zurückgehalten wird (Übersetzung vor der ersten Auswertung in dieser Richtung)'}
        evaluable: {type: boolean, description: 'false bei Buchstabier-Übungen (keine Auswertung)'}
        text_de: {type: [string, 'null'], description: 'null, wenn Deutsch die zurückgehaltene Zielsprache ist'}
        text_en: {type: [string, 'null'], description: 'null, wenn Englisch die zurückgehaltene Zielsprache ist'}
        lines:
          type: [array, 'null']
          description: Buchstabier-Übungen (UBI-Abgabe)
          items:
            type: object
            properties:
              text: {type: string}
              spell:
                type: array
                items:
                  type: object
                  properties:
                    word: {type: string}
                    spelled: {type: string}
        answers:
          type: object
          description: 'Gespeicherte Eingaben: Übersetzung je Richtung {"de-en": {transcript, translation}}, Diktat {transcript}'
          additionalProperties: true
        done: {type: boolean}
        previous_id: {type: [string, 'null']}
        next_id: {type: [string, 'null']}
    RadioWordMatch:
      type: object
      required: [percent, missing]
      properties:
        percent: {type: integer, minimum: 0, maximum: 100}
        missing: {type: array, items: {type: string}, description: fehlende Wörter der Musterlösung}
    RadioDoneRequest:
      type: object
      required: [done]
      properties:
        done: {type: boolean}
    RadioVocabularyCard:
      type: object
      required: [id, category, de, en, streak, learned]
      properties:
        id: {type: string}
        category: {type: string}
        de: {type: string}
        en: {type: [string, 'null']}
        hint: {type: [string, 'null']}
        streak: {type: integer}
        learned: {type: boolean}
    RadioPracticeCatalog:
      type: object
      required: [catalog, tasks]
      properties:
        catalog: {type: string, enum: [SRC, UBI]}
        tasks:
          type: array
          items:
            type: object
            required: [id, number, kind, done, evaluated, locked]
            properties:
              id: {type: string}
              number: {type: integer}
              kind: {type: string, description: 'Meldungsart, z. B. distress, urgency, safety, routine'}
              teaser: {type: [string, 'null']}
              done: {type: boolean}
              evaluated: {type: boolean, description: schon einmal ausgewertet}
              locked: {type: boolean}
    RadioPracticeTask:
      type: object
      required: [id, course_id, catalog, number, kind, situation_de, fields, answers, done]
      properties:
        id: {type: string}
        course_id: {type: string}
        catalog: {type: string, enum: [SRC, UBI]}
        number: {type: integer}
        kind: {type: string}
        situation_de: {type: string}
        situation_en: {type: [string, 'null']}
        fields:
          type: array
          items:
            type: object
            required: [name, label]
            properties:
              name: {type: string, description: 'z. B. rank, dsc, radio, message (UBI: circle statt dsc)'}
              label: {type: string}
              placeholder: {type: [string, 'null']}
              multiline: {type: boolean}
        answers: {type: object, additionalProperties: {type: string}, description: gespeicherte Eingaben je Feld}
        done: {type: boolean}
        previous_id: {type: [string, 'null']}
        next_id: {type: [string, 'null']}
    ExamRegistration:
      type: object
      required: [course_id, web_url, registration_in_app, guides, committees]
      properties:
        course_id: {type: string}
        web_url: {type: string, format: uri, description: 'Web-Seite …/bootsscheine/<kurs>/pruefung-anmelden/'}
        registration_in_app: {type: boolean, const: false}
        committees_note: {type: string, description: 'Hinweis, dass die Liste der Prüfungsausschüsse nicht vollständig ist (unter der Liste anzeigen)'}
        guides:
          type: array
          description: Eine Anleitung je Prüfung des Kurses (Reiter im Web), Felder wie ExamGuideService::payload
          items:
            type: object
            required: [key, tab, title]
            additionalProperties: true
            properties:
              key: {type: string}
              tab: {type: string}
              title: {type: string}
              intro: {type: [string, 'null']}
              fee: {type: [string, 'null']}
              fee_note: {type: [string, 'null']}
              lead_time: {type: [string, 'null']}
              min_age: {type: [string, 'null']}
              apply: {description: Anmeldehinweise}
              deadline: {type: [string, 'null']}
              documents: {description: Unterlagen}
              variants: {type: array, items: {type: object, additionalProperties: true}, description: 'Prüfungsformen mit scope (Umfang) und pass_text (Bestehensgrenze)'}
              exam_parts: {description: Prüfungsteile}
              faq: {description: Häufige Fragen}
              providers: {description: Anbieter/Prüfungsorganisationen}
        committees:
          type: array
          description: Prüfungsausschüsse aus dem Content-Paket (nicht vollständig, siehe `committees_note`), die für den Kurs zuständigen zuerst (`matches`)
          items:
            type: object
            required: [id, label, commission, matches]
            additionalProperties: true
            properties:
              id: {type: string}
              label: {type: string}
              commission: {type: string}
              location_type: {type: [string, 'null']}
              contact_person: {type: [string, 'null']}
              address: {type: [string, 'null']}
              postal_code: {type: [string, 'null']}
              city: {type: [string, 'null']}
              phone: {type: [string, 'null']}
              fax: {type: [string, 'null']}
              email: {type: [string, 'null']}
              website: {type: [string, 'null']}
              office_hours: {type: [string, 'null']}
              note: {type: [string, 'null']}
              course_codes: {type: array, items: {type: string}}
              states: {type: array, items: {type: string}, description: 'Bundesländer (ISO 3166-2), aus dem Namen abgeleitet'}
              rank: {type: integer}
              matches: {type: boolean}
    PassRule:
      type: object
      properties:
        description: {type: string, description: 'z. B. „Basis 5/7 · See 18/23 · 60 Minuten“'}
        note: {type: [string, 'null']}
        minimum_correct: {type: [integer, 'null'], description: 'Gesamtgrenze, wenn es keine Prüfungsteile gibt (seit 1.6.0 in der Prüfungsübersicht befüllt)'}
        minimum_score: {type: [number, 'null']}
        parts:
          type: array
          description: >-
            Seit 1.6.0 (Prüfungsübersicht): Bestehensgrenze je Prüfungsteil, z. B. SBF See
            Basisfragen 5 von 7 und Spezifische See 18 von 23. Leer, wenn nur eine Gesamtgrenze gilt.
          items:
            type: object
            required: [label, minimum_correct, of]
            properties:
              label: {type: string}
              minimum_correct: {type: integer}
              of: {type: integer}
    ExamResultSummary:
      type: object
      required: [exam_id, status, passed, score, correct_count, question_count]
      properties:
        exam_id: {type: string}
        status: {type: string, const: evaluated}
        passed: {type: boolean}
        score: {type: number, minimum: 0, maximum: 1}
        correct_count: {type: integer}
        question_count: {type: integer}
        evaluated_at: {type: [string, 'null'], format: date-time}
    ExamOption:
      type: object
      required: [id, kind, name, question_count, pass_rule, startable, locked]
      properties:
        id: {type: string, description: '„simulation“ oder Bogen-ID (= paper_id beim Start)'}
        kind: {type: string, enum: [rule_set, fixed_paper]}
        name: {type: string}
        paper_number: {type: [integer, 'null']}
        question_count: {type: integer}
        duration_seconds: {type: [integer, 'null'], description: null = Zeit ergibt sich beim Start (Kombikurse) bzw. ohne Zeitlimit}
        pass_rule: {$ref: '#/components/schemas/PassRule'}
        question_types:
          description: >-
            Seit 1.6.0: Anzahl der Fragen je Fragetyp. Feste Bögen immer; Zufallsprüfung nur, wenn alle
            Fragen der Prüfungsmodule denselben Typ haben (sonst null – die Verteilung steht erst beim Start fest).
          oneOf:
            - type: object
              properties:
                single_choice: {type: integer}
                multi_choice: {type: integer}
                open_text: {type: integer}
            - type: 'null'
        startable: {type: boolean}
        locked: {type: boolean}
        lock_reason: {type: [string, 'null'], enum: [trial, drip, null]}
        unlock_at: {type: [string, 'null'], format: date-time}
        running_exam_id: {type: [string, 'null']}
        last_result:
          oneOf:
            - {$ref: '#/components/schemas/ExamResultSummary'}
            - type: 'null'
    ExamOptionsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ExamOption'}
        meta:
          type: object
          properties:
            available: {type: boolean}
            live: {type: boolean}
            rule_set_version: {type: [string, 'null']}
            limit: {type: [integer, 'null']}
            history:
              type: array
              items: {$ref: '#/components/schemas/ExamResultSummary'}
    StartExamRequest:
      type: object
      properties:
        mode: {type: [string, 'null'], enum: [official_simulation, simulation, paper, null]}
        paper_id: {type: [string, 'null']}
    ExamAnswer:
      type: object
      required: [question_id, selected_answer_ids, answered]
      properties:
        question_id: {type: string}
        selected_answer_ids: {type: array, items: {type: string}}
        known: {type: [boolean, 'null']}
        answered: {type: boolean}
        flagged: {type: boolean, description: 'Seit 1.3.0: zur Überprüfung markiert (PUT …/flag)'}
        marked_for_review: {type: boolean, description: 'Gleich flagged (Konzept-Name; bis 1.2.0 immer false)'}
    ExamQuestion:
      allOf:
        - {$ref: '#/components/schemas/Question'}
        - type: object
          properties:
            position: {type: integer}
            model_answer: {type: [string, 'null'], description: nur nach /reveal (offene Fragen)}
            flagged: {type: boolean, description: 'Seit 1.3.0: zur Überprüfung markiert'}
    ExamSession:
      type: object
      required: [exam_id, status, course_id, started_at, server_time, question_count, questions, answers]
      properties:
        exam_id: {type: string}
        status: {type: string, enum: [running, evaluated, aborted], description: 'aborted seit 1.11.0 (abgebrochen, ohne Wertung; result = null)'}
        aborted_at: {type: ['string', 'null'], format: date-time, description: 'Nur bei aborted (seit 1.11.0)'}
        course_id: {type: string}
        course: {type: object, properties: {code: {type: string}, name: {type: string}}}
        mode: {type: string, enum: [simulation, paper]}
        paper_id: {type: [string, 'null']}
        paper_number: {type: [integer, 'null']}
        live: {type: boolean}
        reduced: {type: boolean, description: Fragenpool kleiner als vorgesehen – verkürzte Übungsprüfung}
        started_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        server_time: {type: string, format: date-time}
        remaining_seconds: {type: [integer, 'null']}
        time_limit_seconds: {type: [integer, 'null']}
        pass_rule: {$ref: '#/components/schemas/PassRule'}
        question_count: {type: integer}
        flagged_count: {type: integer, description: 'Seit 1.3.0: Anzahl markierter Fragen'}
        questions:
          type: array
          items: {$ref: '#/components/schemas/ExamQuestion'}
        answers:
          type: array
          items: {$ref: '#/components/schemas/ExamAnswer'}
        result:
          oneOf:
            - {$ref: '#/components/schemas/ExamResult'}
            - type: 'null'
    ExamSessionResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/ExamSession'}
    ExamAnswerRequest:
      type: object
      properties:
        selected_answer_ids: {type: array, uniqueItems: true, items: {type: string}}
        known: {type: [boolean, 'null']}
        marked_for_review: {type: [boolean, 'null'], description: 'Seit 1.3.0: true/false setzt die Markierung (wie PUT …/flag), null lässt sie unverändert'}
        age_ms: {type: [integer, 'null'], minimum: 0, description: 'Seit 1.11.0: Alter der Antwort beim Senden in Millisekunden (zwischengespeicherte Antwort); Vorrang vor answered_at, unabhängig von der Geräteuhr'}
        answered_at: {type: [string, 'null'], format: date-time, description: 'Seit 1.11.0: Zeitpunkt der Antwort laut Gerät (falls kein age_ms); begrenzt auf Prüfungsstart bis Serverzeit'}
    ExamAnswerSavedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [saved, question_id, selected_answer_ids]
          properties:
            saved: {type: boolean, const: true}
            applied: {type: boolean, description: 'Seit 1.11.0: false = auf dem Server lag bereits ein neuerer Stand; die Felder zeigen diesen'}
            question_id: {type: string}
            selected_answer_ids: {type: array, items: {type: string}}
            known: {type: [boolean, 'null']}
            answered: {type: boolean}
            marked_for_review: {type: boolean}
            flagged: {type: boolean}
            saved_at: {type: [string, 'null'], format: date-time}
    ExamFlagRequest:
      type: object
      required: [flagged]
      properties:
        flagged: {type: boolean}
    ExamFlagResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [question_id, flagged, flagged_count]
          properties:
            question_id: {type: string, description: Position der Frage}
            flagged: {type: boolean}
            flagged_count: {type: integer}
