      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoProgressResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/navigation-tasks:
    get:
      tags: [Navigation]
      operationId: listNavigationTasks
      summary: Navigationsaufgaben
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Aufgaben
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NavigationTaskListResponse'}
        '403': {$ref: '#/components/responses/Problem'}
  /navigation-tasks/{taskId}:
    get:
      tags: [Navigation]
      operationId: getNavigationTask
      summary: Aufgabe mit Teilaufgaben
      description: >-
        Lösungen nur für Teilaufgaben, die beantwortet oder aufgedeckt wurden. `show_solution=true`
        deckt alle Teilaufgaben auf (wie „Lösung anzeigen“ im Web; wird gespeichert).
        Aufgaben gehören teils zu mehreren Kursen: `course_id` angeben, sonst gilt der erste Kurs
        mit freigeschaltetem Navigationstrainer.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/TaskId'
        - in: query
          name: course_id
          schema: {type: string}
        - in: query
          name: show_solution
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Aufgabe
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NavigationTaskResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /navigation-tasks/{taskId}/parts/{partId}:
    post:
      tags: [Navigation]
      operationId: answerNavigationPart
      summary: Eigene Antwort und/oder Selbsteinschätzung speichern, amtliche Lösung erhalten
      description: >-
        Erweiterung. `self_assessment` markiert die Teilaufgabe als erledigt.
        Seit 1.4.0 (Navigation): Hat die Teilaufgabe prüfbare Lösungswerte (`auto_check: true`) und ist eine
        eigene Antwort gespeichert, enthält die Antwort `check` – die automatische Prüfung der eingegebenen
        Werte gegen das amtliche Ergebnis (Hilfe, keine Bewertung; die Selbsteinschätzung bleibt maßgeblich
        und wird unverändert gespeichert). Sonst ist `check` null.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/TaskId'
        - in: path
          name: partId
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                course_id: {type: [string, 'null']}
                answer: {type: [string, 'null'], maxLength: 5000}
                self_assessment: {type: [string, 'null'], enum: [correct, partly, wrong, null]}
      responses:
        '200':
          description: Lösung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [part_id, solution, done]
                    properties:
                      part_id: {type: string}
                      solution: {type: [string, 'null']}
                      my_answer: {type: [string, 'null']}
                      self_assessment: {type: [string, 'null']}
                      done: {type: boolean}
                      auto_check: {type: boolean, description: 'Seit 1.4.0: Teilaufgabe hat prüfbare Lösungswerte'}
                      check:
                        description: 'Seit 1.4.0: automatische Prüfung der gespeicherten eigenen Antwort; null ohne Werte oder ohne Antwort'
                        oneOf:
                          - {$ref: '#/components/schemas/NavigationCheck'}
                          - {type: 'null'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/praxis:
