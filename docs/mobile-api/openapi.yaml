        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      card_id: {type: string}
                      status: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio:
    get:
      tags: [Radio]
      operationId: getRadioOverview
      summary: Funktraining-Übersicht (Texte, Vokabeln, Funkpraxis, Simulator-Link)
      description: >-
        Erweiterung (RadioService::overview wie der Web-Lernbereich). Nur für Kurse mit Fähigkeit
        `funk` – sonst 404. Ohne Zugang 403 `ENTITLEMENT_REQUIRED` (`details.capability: funk`).
        Teilumfang: je Übungsart/Katalog die ersten `meta.limit` Übungen, weitere `locked: true`
        ohne `teaser`. Lernstand (erledigt, Eingaben, Vokabelserien) ist derselbe wie im Web.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Übersicht
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/RadioOverview'}
                  meta:
                    type: object
                    required: [limit, streak_to_learn]
                    properties:
                      limit: {type: [integer, 'null'], description: 'null = voller Zugang, n = Teilumfang je Übungsart/Katalog'}
                      streak_to_learn: {type: integer, description: Vokabel gelernt nach so vielen „gewusst“ in Folge}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/spelling:
    get:
      tags: [Radio]
      operationId: getRadioSpelling
      summary: Buchstabiertafel mit Aussprachehilfen und Ziffern je Funkkatalog
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Buchstabiertafel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [letters, digits, catalogs]
                    properties:
                      letters:
                        type: array
                        items:
                          type: object
                          required: [letter, word]
                          properties:
                            letter: {type: string}
                            word: {type: string}
                            hint: {type: [string, 'null'], description: Aussprachehilfe}
                      digits:
                        type: array
                        items:
                          type: object
                          required: [catalog, items]
                          properties:
                            catalog: {type: string, enum: [SRC, UBI]}
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  digit: {type: string}
                                  word: {type: string}
                                  spoken: {type: [string, 'null']}
                      catalogs: {type: array, items: {type: string, enum: [SRC, UBI]}}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}:
    get:
      tags: [Radio]
      operationId: getRadioText
      summary: Funktext (SRC-Übersetzung, UBI-Diktat/-Buchstabieren) mit gespeicherten Eingaben
      description: >-
        Übersetzungstexte enthalten beide Sprachen (`text_de`, `text_en`); die App blendet die
        Zielsprache bis zur Auswertung aus (wie im Web). Diktat: `text_de` wird vorgelesen
        (Sprachausgabe der App). Buchstabieren: `lines` mit markierten Wörtern und deren
        Buchstabierung. Gesperrt (Teilumfang) → 403 `CONTENT_LOCKED`.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioTextId'
      responses:
        '200':
          description: Funktext
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/RadioText'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioText
      summary: Mitschrift/Übersetzung auswerten (und speichern)
      description: >-
        Wortvergleich wie im Web (RadioService::evaluate). Übersetzung: `direction` Pflicht
        (`de-en`/`en-de`), `transcript` = Mitschrift der Ausgangssprache, `translation` = Übersetzung.
        Diktat (UBI): nur `transcript`. Buchstabier-Übungen werden nicht ausgewertet (422).
        Ohne Eingabe → 422. Die Eingaben werden gespeichert (erscheinen in `answers`).
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioTextId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                direction: {type: string, enum: [de-en, en-de, ''], default: ''}
                transcript: {type: string, maxLength: 5000, default: ''}
                translation: {type: string, maxLength: 5000, default: ''}
      responses:
        '200':
          description: Auswertung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [text_id, transcript, translation, solution]
                    properties:
                      text_id: {type: string}
                      transcript: {oneOf: [{$ref: '#/components/schemas/RadioWordMatch'}, {type: 'null'}]}
                      translation: {oneOf: [{$ref: '#/components/schemas/RadioWordMatch'}, {type: 'null'}]}
                      solution:
                        type: object
                        properties:
                          from: {type: [string, 'null'], description: Ausgangstext (Musterlösung der Mitschrift)}
                          to: {type: [string, 'null'], description: Musterübersetzung}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/texts/{textId}/done:
    put:
      tags: [Radio]
      operationId: setRadioTextDone
      summary: Funktext als erledigt markieren (oder zurücksetzen)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioTextId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RadioDoneRequest'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [text_id, done]
                    properties:
                      text_id: {type: string}
                      done: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/vocabulary:
    get:
      tags: [Radio]
      operationId: listRadioVocabulary
      summary: Vokabelkarten eines Funkkatalogs (optional einer Kategorie)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - in: query
          name: catalog
          required: true
          schema: {type: string, enum: [SRC, UBI]}
        - in: query
          name: category
          description: Kategorie aus der Übersicht (`vocabulary[].category`), z. B. „Notverkehr“
          schema: {type: string, maxLength: 191}
      responses:
        '200':
          description: Karten
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RadioVocabularyCard'}
                  meta:
                    type: object
                    properties:
                      catalog: {type: string}
                      category: {type: [string, 'null']}
                      total: {type: integer}
                      learned: {type: integer}
                      streak_to_learn: {type: integer}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/vocabulary/{cardId}/answers:
    post:
      tags: [Radio]
      operationId: answerRadioVocabulary
      summary: Vokabel „gewusst“ / „nicht gewusst“
      description: >-
        RadioService::vocabularyAnswer: gewusst → Serie +1, nicht gewusst → 0; gelernt ab
        `streak_to_learn` in Folge (bleibt gelernt). `streak` = die auf der Karte angezeigte Serie:
        weicht der gespeicherte Stand ab (Antwort schon gezählt, z. B. zweites Gerät), wird nichts
        geändert und `repeated: true` geliefert. Ohne `streak`: zweite Antwort innerhalb von
        2 Sekunden wird ignoriert. Zusätzlich optional Idempotency-Key für Netzwiederholungen.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - in: path
          name: cardId
          required: true
          schema: {type: string, maxLength: 64}
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [known]
              properties:
                known: {type: boolean}
                streak: {type: [integer, 'null'], minimum: 0}
      responses:
        '200':
          description: Neuer Stand
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [card_id, known, streak, learned, repeated]
                    properties:
                      card_id: {type: string}
                      known: {type: boolean}
                      streak: {type: integer}
                      learned: {type: boolean}
                      repeated: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice:
    get:
      tags: [Radio]
      operationId: listRadioPractice
      summary: Funkpraxis-Szenarien je Katalog
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Szenarien
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RadioPracticeCatalog'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}:
    get:
      tags: [Radio]
      operationId: getRadioPractice
      summary: Funkpraxis-Aufgabe (Lage, Eingabefelder, gespeicherte Eingaben – ohne Musterlösung)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioScenarioId'
      responses:
        '200':
          description: Aufgabe
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/RadioPracticeTask'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/evaluate:
    post:
      tags: [Radio]
      operationId: evaluateRadioPractice
      summary: Funkpraxis auswerten (Prüfpunkte und Musterlösung je Feld)
      description: >-
        RadioPracticeService::evaluate: `answers` = Feldname (`fields[].name`) → Text; unbekannte
        Felder werden ignoriert, Eingaben gespeichert. Ohne Eingabe → 422.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties: {type: string, maxLength: 5000}
      responses:
        '200':
          description: Auswertung
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [scenario_id, fields, passed, total]
                    properties:
                      scenario_id: {type: string}
                      passed: {type: integer, description: erfüllte Prüfpunkte}
                      total: {type: integer}
                      fields:
                        type: array
                        items:
                          type: object
                          required: [name, label, checks, solution]
                          properties:
                            name: {type: string}
                            label: {type: string}
                            solution: {type: [string, 'null'], description: Musterlösung des Feldes}
                            checks:
                              type: array
                              items:
                                type: object
                                properties:
                                  label: {type: string}
                                  ok: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/practice/{scenarioId}/done:
    put:
      tags: [Radio]
      operationId: setRadioPracticeDone
      summary: Funkpraxis-Aufgabe als erledigt markieren (oder zurücksetzen)
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/RadioScenarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RadioDoneRequest'}
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [scenario_id, done]
                    properties:
                      scenario_id: {type: string}
                      done: {type: boolean}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /courses/{courseId}/radio/samples:
    get:
      tags: [Radio]
      operationId: listRadioSamples
      summary: Muster-Funksprüche je Katalog und Meldungsart
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Muster
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [catalog, samples]
                      properties:
                        catalog: {type: string, enum: [SRC, UBI]}
                        samples:
                          type: array
                          items:
                            type: object
                            required: [kind, id, number, locked]
                            properties:
                              kind: {type: string, enum: [distress, acknowledge, relay, false_alert, urgency, urgency_cancel, safety, routine]}
                              id: {type: string}
                              number: {type: integer}
                              locked: {type: boolean}
                              situation: {type: [string, 'null']}
                              message: {type: [string, 'null'], description: Mustermeldung}
                              steps:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    label: {type: string}
                                    text: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /coupons/redeem:
    post:
      tags: [Coupons]
      operationId: redeemCoupon
      summary: Beitrittscode einer Gruppenlizenz einlösen
      description: >-
        Abweichung: Shop-Käufe schalten den Zugang automatisch frei – es gibt keine per E-Mail
        verschickten Zugangscodes. Eingelöst werden nur Beitrittscodes bzw. Einladungslinks von
        Gruppenlizenzen (`g…`/`i…` mit 32 Hex-Zeichen oder der ganze Link `…/gruppe/<code>/`).
        WooCommerce-Gutscheine sind Rabatte für den Kauf: 422 `COUPON_NOT_SUPPORTED`.
        Unbekannte Codes: 422 `COUPON_INVALID` mit Hinweis auf die automatische Freischaltung.
        Limit: 10 Versuche je Stunde.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: Eingelöst (oder schon Mitglied)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CouponRedemptionResponse'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /profile/export:
    post:
      tags: [Privacy]
      operationId: requestDataExport
      summary: Datenexport erstellen (Art. 15/20 DSGVO)
      description: >-
        Erstellt den Export sofort (`status: ready`) aus allen WordPress-Datenexporten: Lernstand,
        Prüfungen, Zugänge und App-Sitzungen dieses Plugins, WordPress-Konto, WooCommerce
        (Kundendaten, Bestellungen). Gespeichert in der Datenbank (kein öffentlicher
        Upload-Ordner), nur mit Anmeldung abrufbar, nach 24 Stunden automatisch gelöscht.
        Ein neuer Export ersetzt den vorherigen. Limit: 5 je Tag.
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: Export bereit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportStatusResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}:
    get:
      tags: [Privacy]
      operationId: getDataExport
      summary: Exportstatus und Download-Adresse
      parameters:
        - $ref: '#/components/parameters/TenantSlug'
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportStatusResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /profile/export/{exportId}/download:
    get:
      tags: [Privacy]
      operationId: downloadDataExport
      summary: Export als JSON herunterladen (nur Eigentümer, mit Bearer-Token)
      description: Erweiterung (ersetzt den öffentlichen, tokenbasierten Download des Konzepts). Kein Tenant-Header nötig.
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: JSON-Datei (Content-Disposition attachment)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportFile'}
        '404': {$ref: '#/components/responses/Problem'}
        '410': {$ref: '#/components/responses/Problem'}
  /files/{fileId}:
    get:
      tags: [Files]
      operationId: downloadProtectedFile
      summary: Geschützte Kursdatei oder Seekarte herunterladen
      description: >-
        Erweiterung. Gleiche Freigabe wie /bootsscheine/datei/<id>/ im Web (Kurs-PDFs,
        lizenzierte Seekarten nur mit vollem Navigationszugang), aber mit Bearer-Token.
        URLs kommen aus Kursdetails (`downloads`, `section_files`, `charts`) und Navigationsaufgaben.
        Kein Tenant-Header nötig.
      parameters:
        - in: path
          name: fileId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Datei
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque (bpa_…)
      description: Access-Token aus /auth/login bzw. /auth/refresh; gilt 15 Minuten und nur für diesen Namespace.
  parameters:
    TenantSlug:
      in: header
      name: X-Tenant-Slug
      required: true
      description: Slug aus `memberships[].tenant_slug`. Fehlt er → 422, passt er nicht → 403 `TENANT_MEMBERSHIP_REQUIRED`. Kein Berechtigungsnachweis.
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID. Gleicher Schlüssel und gleicher Inhalt → gespeicherte Antwort; gleicher Schlüssel, anderer Inhalt → 409 `IDEMPOTENCY_KEY_REUSED`. Aufbewahrung 7 Tage.
      schema: {type: string, format: uuid}
    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      description: Optional (Vorgang ist ohnehin wiederholbar); mit Schlüssel wie IdempotencyKey.
      schema: {type: string, format: uuid}
    Page:
      in: query
      name: page
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      in: query
      name: per_page
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    CourseId:
      in: path
      name: courseId
      required: true
      description: Numerische Kurs-ID (bp_course.id); der Kurscode (z. B. sbf-see) wird ebenfalls akzeptiert.
      schema: {type: string}
    CollectionId:
      in: path
      name: collectionId
      required: true
      schema: {type: string}
    QuestionId:
      in: path
      name: questionId
      required: true
      schema: {type: string}
    ExamQuestionPosition:
      in: path
      name: questionId
      required: true
      description: Position der Frage in der Prüfung (1…n) = `questions[].id` der laufenden Prüfung.
      schema: {type: string}
    AttemptId:
      in: path
      name: attemptId
      required: true
      schema: {type: string}
    ExamId:
      in: path
      name: examId
      required: true
      schema: {type: string}
    LessonId:
      in: path
      name: lessonId
      required: true
      schema: {type: string}
    TaskId:
      in: path
      name: taskId
      required: true
      schema: {type: string}
    RadioTextId:
      in: path
      name: textId
      required: true
      description: Quell-ID des Funktexts, z. B. TXT-SRC-01, UBI-AUF-01
      schema: {type: string, pattern: '^[A-Za-z0-9-]{1,64}$'}
    RadioScenarioId:
      in: path
      name: scenarioId
      required: true
      description: Quell-ID des Funkpraxis-Szenarios, z. B. SRC-01
      schema: {type: string, pattern: '^[A-Za-z0-9-]{1,64}$'}
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: {type: string}
    ExportId:
      in: path
      name: exportId
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{32}$'}
  responses:
    Problem:
      description: Fehlerantwort (RFC-9457-Stil)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, message, request_id]
      properties:
        type: {type: string, format: uri, examples: ['urn:bootspruefung:problem:entitlement-expired']}
        title: {type: string}
        status: {type: integer}
        detail: {type: string, description: Deutsche Meldung (Du-Form)}
        message: {type: string, description: 'Gleich detail (Erweiterung, für einfache Clients)'}
        code:
          type: string
          enum: [UNAUTHENTICATED, REFRESH_TOKEN_REUSED, REFRESH_TOKEN_ROTATED, PASSWORD_RESET_INVALID_OR_EXPIRED, TENANT_MEMBERSHIP_REQUIRED, ENTITLEMENT_REQUIRED, ENTITLEMENT_EXPIRED, ENTITLEMENT_SUSPENDED, CONTENT_LOCKED, RESOURCE_NOT_FOUND, VALIDATION_FAILED, IDEMPOTENCY_KEY_REUSED, REQUEST_IN_PROGRESS, QUESTION_TOKEN_EXPIRED, EXAM_NOT_STARTABLE, EXAM_ALREADY_SUBMITTED, EXAM_NOT_SUBMITTED, EXAM_EXPIRED, EXAM_ANSWER_LOCKED, COUPON_INVALID, COUPON_NOT_SUPPORTED, EXPORT_EXPIRED, RATE_LIMITED, MOBILE_API_DISABLED, HTTPS_REQUIRED, METHOD_NOT_ALLOWED, INTERNAL_ERROR]
        request_id: {type: string}
        errors:
          type: object
          description: Feldfehler (bei VALIDATION_FAILED)
          additionalProperties:
            type: array
            items: {type: string}
        details:
          type: object
          description: "Zusatzinfos, z. B. bei ENTITLEMENT_*: course_id, capability, access_status, webshop_url"
          additionalProperties: true
        retry_after: {type: integer, description: Sekunden (auch als Header Retry-After)}
    TokenPair:
      type: object
      required: [access_token, token_type, access_expires_at, expires_in, refresh_token, refresh_expires_at, session_id]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        access_expires_at: {type: string, format: date-time, description: 15 Minuten nach Ausgabe}
        expires_in: {type: integer, description: Sekunden bis zum Ablauf des Access-Tokens}
        refresh_token: {type: string}
        refresh_expires_at: {type: string, format: date-time, description: '30 Tage Inaktivität, höchstens 90 Tage ab Anmeldung'}
        session_id: {type: string}
    TokenPairResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TokenPair'}
    LoginRequest:
      type: object
      required: [email, password, device_name]
      properties:
        email: {type: string, description: E-Mail-Adresse oder Benutzername}
        password: {type: string, minLength: 1, writeOnly: true}
        device_name: {type: string, minLength: 1, maxLength: 100}
        device_platform: {type: [string, 'null'], enum: [ios, android, null]}
        app_version: {type: [string, 'null'], maxLength: 40}
    LoginResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - {$ref: '#/components/schemas/TokenPair'}
            - {$ref: '#/components/schemas/Profile'}
    User:
      type: object
      required: [id, name, email, email_verified]
      properties:
        id: {type: string}
        name: {type: string}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: string, format: email}
        email_verified:
          type: boolean
          const: true
          description: >-
            Immer true. Shop-Konten brauchen keine E-Mail-Bestätigung; die App bietet keinen
            Bestätigungsablauf an (der Endpunkt `/auth/email/verification-notification` des Konzepts
            entfällt seit 1.1.0).
    Membership:
      type: object
      required: [tenant_slug, tenant_name, status, role, branding]
      properties:
        tenant_slug: {type: string}
        tenant_name: {type: string, description: Markenname aus den Plugin-Einstellungen}
        status: {type: string, const: active}
        role: {type: string, const: learner}
        branding: {$ref: '#/components/schemas/Branding'}
        links:
          type: object
          description: Erweiterung – Web-Seiten zum Öffnen im Systembrowser
          properties:
            web_learning: {type: string, format: uri}
            shop: {type: [string, 'null'], format: uri}
            account: {type: [string, 'null'], format: uri}
            privacy_policy: {type: [string, 'null'], format: uri}
    Branding:
      type: object
      properties:
        logo_url: {type: [string, 'null'], format: uri}
        primary_color: {type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$'}
        support_email: {type: [string, 'null'], format: email}
    Profile:
      type: object
      required: [user, memberships]
      properties:
        user: {$ref: '#/components/schemas/User'}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
    MeResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Profile'}
    DeviceSession:
      type: object
      required: [id, device_name, created_at, last_used_at, current]
      properties:
        id: {type: string}
        device_name: {type: string}
        device_platform: {type: [string, 'null'], enum: [ios, android, null]}
        app_version: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        current: {type: boolean}
    DeletionRequestResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [request_id, status, already_requested, message]
          properties:
            request_id: {type: string}
            status: {type: string, enum: [pending_confirmation, confirmed]}
            already_requested: {type: boolean}
            message: {type: string}
    Entitlement:
      type: object
      required: [status, valid_from, valid_until]
      properties:
        status:
          type: string
          description: >-
            active = voller Zugang zu mindestens einem Bereich; limited (Erweiterung) = nur
            kostenloser Teilumfang; pending (Erweiterung) = Kauf wartet auf Zahlung;
            suspended/expired/revoked aus den Zugängen; not_granted = kein Zugang.
          enum: [active, limited, pending, expired, suspended, revoked, not_granted]
        valid_from: {type: [string, 'null'], format: date-time}
        valid_until: {type: [string, 'null'], format: date-time, description: null = unbegrenzt bzw. ohne Kauf}
        trial: {type: boolean}
        purchased: {type: boolean, description: 'Es gibt einen gültigen Zugang (Kauf, Gruppe, manuell).'}
        limits:
          type: object
          description: Fähigkeit → Limit im Teilumfang (z. B. smarttrainer = Fragen je Modul, exam = Bögen)
          additionalProperties: {type: integer}
    FeatureAccess:
      type: object
      required: [available, full]
      properties:
        available: {type: boolean, description: voll oder im Teilumfang nutzbar}
        full: {type: boolean}
        limit: {type: [integer, 'null']}
    ProgressSummary:
      type: object
      required: [percent, completed, total]
      properties:
        percent: {type: integer, minimum: 0, maximum: 100, description: Anteil gefestigter Fragen}
        completed: {type: integer, minimum: 0, description: gefestigte Fragen}
        total: {type: integer, minimum: 0, description: Fragen im freigeschalteten Umfang}
        new: {type: integer}
        unsure: {type: integer}
        learning: {type: integer}
        mastered: {type: integer}
    CourseSummary:
      type: object
      required: [id, code, name, access, progress, capabilities, features, webshop_url]
      properties:
        id: {type: string}
        code: {type: string}
        slug: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        course_type: {type: string, enum: [full, combo, addon]}
        access: {$ref: '#/components/schemas/Entitlement'}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        capabilities:
          type: array
          description: Bereiche, die der Kurs enthält (unabhängig vom Zugang)
          items: {type: string, enum: [smarttrainer, favorites, exam, video, navigation, praxis, funk]}
        features:
          type: object
          description: Fähigkeit → Zugriff (zusätzlich `explanations` für Erklärungen nach der Antwort)
          additionalProperties: {$ref: '#/components/schemas/FeatureAccess'}
        webshop_url:
          type: [string, 'null']
          format: uri
          description: Passendstes WooCommerce-Angebot (günstigstes Produkt mit dem Hauptbereich), nur ohne Vollzugang.
    CourseListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/CourseSummary'}
        meta:
          type: object
          properties:
            tenant:
              type: object
              properties:
                slug: {type: string}
                name: {type: string}
            pagination: {$ref: '#/components/schemas/Pagination'}
    Pagination:
      type: object
      properties:
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    Offer:
      type: object
      properties:
        name: {type: string}
        url: {type: string, format: uri}
        price: {type: string}
    FileRef:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: [string, 'null']}
        size_bytes: {type: [integer, 'null']}
        locked: {type: boolean}
        url: {type: [string, 'null'], format: uri, description: 'API-Adresse /files/{id} (Bearer-Token nötig)'}
        requires_authorization: {type: boolean}
    CourseDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - {$ref: '#/components/schemas/CourseSummary'}
            - type: object
              properties:
                modules_count: {type: integer}
                exam_options_count: {type: integer}
                favorites_count: {type: integer}
                trainers: {type: object, additionalProperties: true, description: Zähler der Trainer wie auf der Web-Kursseite}
                offers:
                  type: object
                  description: Fähigkeit → Kaufangebote für gesperrte Bereiche
                  additionalProperties:
                    type: array
                    items: {$ref: '#/components/schemas/Offer'}
                downloads:
                  type: array
                  items: {$ref: '#/components/schemas/FileRef'}
                section_files:
                  type: object
                  additionalProperties:
                    type: array
                    items: {$ref: '#/components/schemas/FileRef'}
                charts:
                  type: array
                  items: {$ref: '#/components/schemas/FileRef'}
                web_url: {type: string, format: uri}
                device_simulator: {$ref: '#/components/schemas/DeviceSimulatorLink'}
                exam_registration:
                  type: object
                  required: [available, web_url]
                  description: Erweiterung. Inhalte über GET /courses/{courseId}/exam-registration.
                  properties:
                    available: {type: boolean}
                    web_url: {type: [string, 'null'], format: uri, description: Web-Seite „Prüfung anmelden“}
    Topic:
      type: object
      properties:
        name: {type: string}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
    Module:
      type: object
      required: [id, code, name, order, question_count, locked, progress]
      properties:
        id: {type: string}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        order: {type: integer}
        question_count: {type: integer, description: Fragen im freigeschalteten Umfang}
        catalog_count: {type: integer, description: Fragen im gesamten Katalog des Moduls}
        locked: {type: boolean}
        lock_reason: {type: [string, 'null'], enum: [drip, trial, null]}
        unlock_at: {type: [string, 'null'], format: date-time}
        progress: {$ref: '#/components/schemas/ProgressSummary'}
        topics:
          type: array
          items: {$ref: '#/components/schemas/Topic'}
    CourseOverviewResponse:
      type: object
      required: [data]
