openapi: 3.1.0
info:
  title: BoatingSchool WordPress Mobile API (implemented subset)
  version: 0.1.0
  description: >-
    Contract for the WordPress plugin included in this handoff. This is a limited
    implementation subset; see README-WP-API.md for routes still requiring LMS adapters.
servers:
  - url: https://example.com/wp-json/boatingschool/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Create a mobile bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, user]
                properties:
                  access_token: { type: string }
                  token_type: { const: Bearer }
                  expires_in: { type: integer, example: 43200 }
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses:
    get:
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Published course posts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /courses/{courseId}:
    get:
      parameters:
        - in: path
          name: courseId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Published course detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Course' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    Course:
      type: object
      required: [id, title, description, url, updated_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        updated_at: { type: string, format: date-time }
    Problem:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
