name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# pipefail: Abstürze vor `| tee` dürfen nicht verschluckt werden.
defaults:
  run:
    shell: bash

jobs:
  converter:
    name: Content-Konverter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, simplexml, fileinfo
          coverage: none
      - name: Abhängigkeiten
        working-directory: tools/content-build
        run: composer install --no-interaction --no-progress
      - name: Tests
        working-directory: tools/content-build
        run: vendor/bin/phpunit
      - name: Paket bauen
        run: php tools/content-build/bin/build-package.php
      - uses: actions/upload-artifact@v4
        with:
          name: content-package
          path: build/*.zip
          retention-days: 14

  golden-master:
    name: Golden Master gegen Laravel
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DB_PW: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, simplexml, fileinfo, pdo_pgsql, pgsql, gd, bcmath
          coverage: none
      - name: Quellrepo zum Snapshot-Commit klonen (nur lesend)
        run: |
          SHA=$(sed -n 's/^| Commit | `\([0-9a-f]\{40\}\)` |$/\1/p' content-source/boatingschool/SOURCE.md)
          test -n "$SHA"
          git clone --quiet https://github.com/hastla007/boatingschool "$RUNNER_TEMP/laravel"
          git -C "$RUNNER_TEMP/laravel" checkout --quiet "$SHA"
      - name: Laravel installieren und seeden
        working-directory: ${{ runner.temp }}/laravel
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE boatingschool LOGIN PASSWORD '$DB_PW'" \
            -c "CREATE ROLE boatingschool_app LOGIN PASSWORD '$DB_PW'" \
            -c "CREATE DATABASE boatingschool OWNER boatingschool" \
            -c "GRANT CONNECT ON DATABASE boatingschool TO boatingschool_app"
          composer install --no-interaction --no-progress --no-scripts
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$DB_PW/; s/^DB_ADMIN_PASSWORD=.*/DB_ADMIN_PASSWORD=$DB_PW/; s/^APP_ENV=.*/APP_ENV=production/" .env
          php artisan key:generate --force
          php artisan migrate --database=pgsql_admin --force
          php artisan db:seed --database=pgsql_admin --force
      - name: Paket bauen und vergleichen
        env:
          BS_DSN: pgsql:host=127.0.0.1;dbname=boatingschool
          BS_USER: boatingschool
        run: |
          php tools/content-build/bin/build-package.php --no-zip
          BS_PASSWORD="$DB_PW" BS_LARAVEL_DIR="$RUNNER_TEMP/laravel" php tools/content-build/golden-master/compare.php build/boatingschool-*/

  plugin:
    name: WordPress-Plugin (PHP ${{ matrix.php }}, WC ${{ matrix.wc }}, MariaDB ${{ matrix.mariadb }})
    runs-on: ubuntu-24.04
    # Beta-Zweig von WooCommerce informiert nur, blockiert nicht.
    continue-on-error: ${{ matrix.experimental }}
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_test
          MARIADB_USER: wp
          MARIADB_PASSWORD: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zielsystem (docs/offene-punkte.md, Punkt 20): PHP 8.5, WordPress 7.1.4, MariaDB 12.3.3,
          # WooCommerce 11.2.2, Block-Theme mit Checkout-Block – inkl. Browser-Tests.
          - { php: '8.5', wc: '11.2.2', mariadb: '12.3.3', e2e: true, experimental: false, theme: kurswasser }
          # Testphase: WooCommerce 11.3 Beta mit demselben Stack (Standard-Block-Theme).
          - { php: '8.5', wc: '11.3.0-beta.2', mariadb: '12.3.3', e2e: true, experimental: true, theme: twentytwentyfive }
          # Untergrenze laut Plugin-Header (Requires PHP 8.1).
          - { php: '8.1', wc: '11.2.2', mariadb: '10.11', e2e: false, experimental: false, theme: twentytwentyfive }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, intl
          coverage: none
      - name: PHP-Syntax
        run: |
          find bootspruefung-learning themes -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m json.tool themes/kurswasser/theme.json > /dev/null
      - name: WordPress bereitstellen
        run: |
          git clone --quiet --depth 1 --branch 7.1.4 https://github.com/johnpbloch/wordpress-core.git "$RUNNER_TEMP/wp"
          cd "$RUNNER_TEMP/wp"
          sed -e "s/database_name_here/wp_test/; s/username_here/wp/; s/password_here/wp/; s/localhost/127.0.0.1/" wp-config-sample.php > wp-config.php
          sed -i "s/define( 'WP_DEBUG', false );/define( 'WP_DEBUG', true );/" wp-config.php
          ln -s "$GITHUB_WORKSPACE/bootspruefung-learning" wp-content/plugins/bootspruefung-learning
          ln -s "$GITHUB_WORKSPACE/themes/kurswasser" wp-content/themes/kurswasser
      - name: Plugin-Schemata identisch mit schema/
        run: diff -r schema/v1 bootspruefung-learning/schema/v1
      - name: Gerätesimulation entspricht dem Snapshot (JS + CSS)
        if: matrix.e2e
        run: |
          tools/sync-device-sim.sh
          git diff --exit-code -- bootspruefung-learning/assets/device-sim
      - name: Rauchtest
        run: |
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/integration/smoke-test.php | tee smoke.log
          if grep -iE "PHP (Warning|Deprecated|Notice|Fatal)" smoke.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: Content-Paket bauen
        run: php tools/content-build/bin/build-package.php
      - name: Import, Lernen und Prüfung (Integration)
        run: |
          WP_DIR="$RUNNER_TEMP/wp" PACKAGE_DIR="$(ls -d build/boatingschool-*/)" php bootspruefung-learning/tests/integration/content-flow-test.php | tee flow.log
          if grep -iE "PHP (Warning|Deprecated|Notice|Fatal)" flow.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: Prüfungsanmeldung (Integration)
        run: |
          WP_DIR="$RUNNER_TEMP/wp" PACKAGE_DIR="$(ls -d build/boatingschool-*/)" php bootspruefung-learning/tests/integration/exam-guide-test.php | tee guide.log
          if grep -iE "PHP (Warning|Deprecated|Notice|Fatal)" guide.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: Zugangslogik (Integration, ohne Shop)
        run: |
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/integration/commerce-test.php | tee commerce.log
          if grep -iE "PHP (Warning|Deprecated|Notice|Fatal)" commerce.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: Teilumfänge, Freigaben, Schutz, Gruppen (Integration)
        run: |
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/integration/membership-test.php | tee membership.log
          if grep -iE "PHP (Warning|Deprecated|Notice|Fatal)" membership.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: WooCommerce bereitstellen
        run: |
          # GitHub-Release, bei Störung wordpress.org (gleiche Version); je Quelle mit Wiederholungen.
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/woocommerce.zip" "https://github.com/woocommerce/woocommerce/releases/download/${WC_VERSION}/woocommerce.zip" \
            || curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/woocommerce.zip" "https://downloads.wordpress.org/plugin/woocommerce.${WC_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/woocommerce.zip" -d "$RUNNER_TEMP/wp/wp-content/plugins"
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/integration/woocommerce-setup.php
        env:
          WC_VERSION: ${{ matrix.wc }}
      - name: WooCommerce-Adapter (Integration)
        run: |
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/integration/woocommerce-test.php | tee woo.log
          if grep -E "PHP Fatal" woo.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
          if grep -E "PHP (Warning|Deprecated|Notice).*bootspruefung-learning" woo.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
          # Browser-Tests laufen wie bisher ohne Shop.
          WP_DIR="$RUNNER_TEMP/wp" WOO_DEACTIVATE=1 php bootspruefung-learning/tests/integration/woocommerce-setup.php
      - name: Browser-Tests (Playwright)
        if: matrix.e2e
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.48.2
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/e2e/setup.php
          cp bootspruefung-learning/tests/e2e/router.php "$RUNNER_TEMP/wp/router.php"
          (cd "$RUNNER_TEMP/wp" && php -d upload_max_filesize=64M -d post_max_size=64M -S 127.0.0.1:8099 router.php > "$RUNNER_TEMP/php-server.log" 2>&1 &)
          sleep 2
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          BP_USER=lerner1 BP_PASS=Test-Passwort-123 node bootspruefung-learning/tests/e2e/learning-flow.mjs
          BP_ADMIN=admin BP_ADMIN_PASS=Admin-Passwort-123 BP_ZIP="$(ls build/*.zip)" node bootspruefung-learning/tests/e2e/admin-import.mjs
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/e2e/setup.php
          BP_USER=lerner1 BP_PASS=Test-Passwort-123 node bootspruefung-learning/tests/e2e/trainers-flow.mjs
          BP_TOKEN="$(WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/e2e/membership-setup.php)" node bootspruefung-learning/tests/e2e/membership-flow.mjs
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/e2e/membership-setup.php reset
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/e2e/guide-setup.php
          node bootspruefung-learning/tests/e2e/guide-flow.mjs
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/e2e/guide-setup.php reset
          # Kaufablauf mit WooCommerce (Block- und klassischer Checkout)
          WP_DIR="$RUNNER_TEMP/wp" php bootspruefung-learning/tests/integration/woocommerce-setup.php
          mkdir -p "$RUNNER_TEMP/shots"
          WP_DIR="$RUNNER_TEMP/wp" BP_SHOTS="$RUNNER_TEMP/shots" node bootspruefung-learning/tests/e2e/checkout-flow.mjs
        env:
          BP_THEME: ${{ matrix.theme }}
      - name: Theme Kurswasser – Demo-Stand und Screenshots
        if: matrix.e2e && matrix.theme == 'kurswasser'
        run: |
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          WP_DIR="$RUNNER_TEMP/wp" php themes/kurswasser/tests/demo-setup.php
          WP_DIR="$RUNNER_TEMP/wp" BP_THEME=kurswasser php bootspruefung-learning/tests/e2e/setup.php
          mkdir -p "$RUNNER_TEMP/theme-shots"
          BP_SHOTS="$RUNNER_TEMP/theme-shots" BP_USER=lerner1 BP_PASS=Test-Passwort-123 node themes/kurswasser/tests/screenshots.mjs
          if grep -E "PHP (Fatal|Warning|Notice|Deprecated).*themes/kurswasser" "$RUNNER_TEMP/php-server.log"; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: Theme-Screenshots hochladen
        if: always() && matrix.e2e && matrix.theme == 'kurswasser'
        uses: actions/upload-artifact@v4
        with:
          name: theme-kurswasser-screenshots
          path: ${{ runner.temp }}/theme-shots
          if-no-files-found: ignore
      - name: Screenshots Kaufablauf
        if: always() && matrix.e2e
        uses: actions/upload-artifact@v4
        with:
          name: checkout-screenshots-wc-${{ matrix.wc }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  staging:
    name: Docker-Staging (Erststart und Neustart)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Staging starten
        working-directory: staging
        run: |
          printf 'DB_PASSWORD=%s\nSTAGING_ADMIN_PASSWORD=%s\nSTAGING_DEMO_PASSWORD=Demo-Passwort-123\nWP_DEBUG=1\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env
          docker compose config -q
          docker compose up -d
          docker compose wait setup || true
          code=$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq setup)")
          test "$code" = 0 || { docker compose logs setup; exit 1; }
          docker compose logs setup | tail -n 5
      - name: Seiten erreichbar
        run: |
          for path in / /kurse/ /bootsscheine/ /shop/ /wp-login.php; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$code $path"; test "$code" = 200
          done
          curl -s -o shop.html http://localhost:8080/shop/
          grep -q 'SBF See' shop.html
      - name: Neustart (Einrichtung wiederholbar)
        working-directory: staging
        run: |
          docker compose run --rm setup > rerun.log 2>&1 || { cat rerun.log; exit 1; }
          tail -n 3 rerun.log
      - name: Keine PHP-Fehler aus Plugin/Theme
        if: always()
        working-directory: staging
        run: |
          docker compose logs wordpress setup > all.log 2>&1 || true
          docker compose exec -T wordpress cat /tmp/wp-debug.log >> all.log 2>/dev/null || true
          if grep -E "PHP (Fatal|Warning|Deprecated).*(bootspruefung-learning|kurswasser)" all.log; then echo "PHP-Fehler im Log (siehe oben)"; exit 1; fi
      - name: Staging abbauen
        if: always()
        working-directory: staging
        run: docker compose down -v
